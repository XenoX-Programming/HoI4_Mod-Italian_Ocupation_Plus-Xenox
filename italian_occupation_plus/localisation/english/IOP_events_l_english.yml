 iop_greece_crete_title:0 "Fate of Crete"
 iop_greece_dodecanese_title:0 "Fate of Dodecanese"
 iop_greece_731_desc:0 "Central Macedonia is under Italian control. Which occupation government should administer it? Only Greece or Bulgaria are eligible, and only if bordering the state."
 iop_greece_184_desc:0 "Thrace is under Italian control. Which occupation government should administer it? Only Greece or Bulgaria are eligible, and only if bordering the state."
 iop_greece_182_desc:0 "Crete is under Italian control. Do we confirm its annexation to the Kingdom of Italy, or cede its administration to the Greek occupation government?"
 iop_greece_164_desc:0 "The Dodecanese are under Italian control. Do we confirm their annexation to the Kingdom of Italy, or cede their administration to the Greek or Turkish occupation government?"
 iop_turkey_edirne_title:0 "Fate of Edirne"
 iop_turkey_bursa_title:0 "Fate of Bursa"
 iop_turkey_istanbul_title:0 "Fate of Istanbul"
 iop_turkey_341_desc:0 "Edirne is under Italian control. Do we confirm its annexation to the Kingdom of Italy, or cede its administration to the Bulgarian or Greek occupation government? Only a bordering occupation government is eligible."
 iop_turkey_340_desc:0 "Bursa is under Italian control. Do we confirm its annexation to the Kingdom of Italy, or cede its administration to the Turkish occupation government?"
 iop_turkey_797_desc:0 "Istanbul is under Italian control. Do we confirm its annexation to the Kingdom of Italy, or cede its administration to the Turkish occupation government?"
 iop_give_bursa_to_ITR:0 "Cede Bursa to Turkey"
 iop_give_istanbul_to_ITR:0 "Cede Istanbul to Turkey"
 iop_africa_ifni_title:0 "Fate of Sidi Ifni"
 iop_africa_783_desc:0 "Sidi Ifni is under Italian control. Do we integrate it into Italy proper, or cede its administration to the North African occupation government?"
 iop_give_ifni_to_INA:0 "Cede Sidi Ifni to North Africa"
 iop_egypt_suez_title:0 "Fall of Suez Canal"
 iop_egypt_446_desc:0 "The Suez Canal is under Italian control. Do we integrate this vital waterway into Italy proper, or cede its administration to the Egyptian occupation government?"
 iop_give_suez_to_IEG:0 "Give Suez to Egypt"
 iop_spain_gibraltar_title:0 "Fall of Gibraltar"
 iop_spain_118_desc:0 "The Rock of Gibraltar is under Italian control. Do we integrate this key to the Mediterranean into Italy proper, or cede its administration to the Spanish occupation government?"
 iop_give_gibraltar_to_ISP:0 "Give Gibraltar to Spain"
 iop_spain_baleares_title:0 "Fate of the Balearic Islands"
 iop_spain_177_desc:0 "The Balearic Islands are under Italian control. Do we integrate them into Italy proper, or cede their administration to the Spanish occupation government?"
 iop_give_baleares_to_ISP:0 "Cede the Balearics to Spain"
 iop_yugo_44_desc:0 "Albania is under Italian control. Which occupation government should administer it? Only occupation governments bordering the state are eligible."
 iop_yugo_805_desc:0 "Northern Epirus is under Italian control. Which occupation government should administer it? Only Albania or Greece are eligible, and only if bordering the state."
 iop_yugo_montenegro_fall_title:0 "Fall of Montenegro"
 iop_yugo_montenegro_fall_desc:0 "Montenegrin resistance has collapsed and the territory lies under Italian control. Shall it be integrated into a neighboring occupation government, or shall a new Montenegrin occupation government be raised in its place?"
 iop_integrate_montenegro_ICR:0 "Integrate into Croatia"
 iop_integrate_montenegro_ISE:0 "Integrate into Serbia"
 iop_integrate_montenegro_IAL:0 "Integrate into Albania"
 iop_create_montenegro_govt:0 "Create a new occupational government"
