 iop_yugo_102_desc:0 "North Slovenia is under Italian control. Which occupation government should administer it? Bordering occupation governments are eligible (with cores) - or hand the territory to a bordering Germany or Austria (no cores)."
 iop_yugo_853_desc:0 "Ljubljana is under Italian control. Do we integrate it into Italy proper, or cede its administration to the Croatian occupation government?"
 iop_yugo_103_desc:0 "Dalmatia is under Italian control. Do we integrate it into Italy proper, or cede its administration to the Croatian occupation government?"
 iop_yugo_109_desc:0 "Croatia is under Italian control. Which occupation government should administer it? Only occupation governments bordering the state are eligible."
 iop_yugo_104_desc:0 "Bosnia is under Italian control. Which occupation government should administer it? Only occupation governments bordering the state are eligible."
 iop_yugo_804_desc:0 "Herzegovina is under Italian control. Which occupation government should administer it? Only occupation governments bordering the state are eligible."
 iop_yugo_105_desc:0 "Montenegro is under Italian control. Which occupation government should administer it? Only occupation governments bordering the state are eligible."
 iop_yugo_107_desc:0 "Serbia is under Italian control. Which occupation government should administer it? Only occupation governments bordering the state are eligible."
 iop_yugo_45_desc:0 "Vojvodina is under Italian control. Which occupation government should administer it? Only Croatia or Serbia are eligible, and only if bordering the state."
 iop_yugo_764_desc:0 "West Banat is under Italian control. Which occupation government should administer it? Only Croatia or Serbia are eligible, and only if bordering the state."
 iop_yugo_802_desc:0 "Kosovo is under Italian control. Which occupation government should administer it? Only occupation governments bordering the state are eligible."
 iop_yugo_803_desc:0 "Southern Serbia is under Italian control. Which occupation government should administer it? Only occupation governments bordering the state are eligible."
 iop_yugo_106_desc:0 "Macedonia is under Italian control. Which occupation government should administer it? Only occupation governments bordering the state are eligible."
 iop_yugo_970_desc:0 "Debar is under Italian control. Which occupation government should administer it? Only occupation governments bordering the state are eligible."
 iop_yugo_163_desc:0 "Zara is an Italian city on the Dalmatian coast. Do we confirm its annexation to the Kingdom of Italy, or cede its administration to the Croatian occupation government?"
 iop_yugo_852_desc:0 "Istria is under Italian control. Do we confirm its annexation to the Kingdom of Italy, or cede its administration to the Croatian occupation government?"

 iop_give_to_ICR:0 "Give to the Croatian Occupation Government"
 iop_give_to_ISE:0 "Give to the Serbian Occupation Government"
 iop_give_to_IMT:0 "Give to the Montenegrin Occupation Government"
 iop_give_zara_to_ICR:0 "Cede Zara to Croatia"
 iop_give_istria_to_ICR:0 "Cede Istria to Croatia"
 iop_annex_to_italy:0 "Annex to Italy"
 iop_annex_to_italy_tt:0 "The state is formally annexed into the Kingdom of Italy."
 iop_give_to_IAL:0 "Give to the Albanian Occupation Government"
 iop_give_to_IBL:0 "Give to the Bulgarian Occupation Government"
 iop_give_to_IGR:0 "Give to the Greek Occupation Government"
 iop_give_to_GER:0 "Give to Germany"
 iop_give_to_AUS:0 "Give to Austria"
 iop_give_crete_to_IGR:0 "Cede Crete to Greece"
 iop_give_dodecanese_to_IGR:0 "Cede Dodecanese to Greece"
 iop_give_dodecanese_to_ITR:0 "Cede Dodecanese to Turkey"
 iop_greece_crete_title:0 "Fate of Crete"
 iop_greece_dodecanese_title:0 "Fate of Dodecanese"
 iop_greece_731_desc:0 "Central Macedonia is under Italian control. Which occupation government should administer it? Only Greece or Bulgaria are eligible, and only if bordering the state."
 iop_greece_184_desc:0 "Thrace is under Italian control. Which occupation government should administer it? Only Greece or Bulgaria are eligible, and only if bordering the state."
 iop_greece_182_desc:0 "Crete is under Italian control. Do we confirm its annexation to the Kingdom of Italy, or cede its administration to the Greek occupation government?"
 iop_greece_164_desc:0 "The Dodecanese are under Italian control. Do we confirm their annexation to the Kingdom of Italy, or cede their administration to the Greek or Turkish occupation government?"
 iop_turkey_edirne_title:0 "Fate of Edirne"
 iop_turkey_bursa_title:0 "Fate of Bursa"
 iop_turkey_istanbul_title:0 "Fate of Istanbul"
 iop_turkey_341_desc:0 "Edirne is under Italian control. Do we confirm its annexation to the Kingdom of Italy, or cede its administration to the Bulgarian or Greek occupation government? Only a bordering occupation government is eligible."
 iop_turkey_340_desc:0 "Bursa is under Italian control. Do we confirm its annexation to the Kingdom of Italy, or cede its administration to the Turkish or Greek occupation government?"
 iop_turkey_797_desc:0 "Constantinople is under Italian control. Do we confirm its annexation to the Kingdom of Italy, cede its administration to the Turkish or Greek occupation government - or restore the city to Greece itself, fulfilling the Megali Idea?"
 iop_give_bursa_to_ITR:0 "Cede Bursa to Turkey"
 iop_give_istanbul_to_ITR:0 "Cede Istanbul to Turkey"
 iop_give_istanbul_to_GRE:0 "Restore Constantinople to Greece"
 iop_africa_ifni_title:0 "Fate of Sidi Ifni"
 iop_africa_783_desc:0 "Sidi Ifni is under Italian control. Do we integrate it into Italy proper, or cede its administration to the North African or Moroccan occupation government?"
 iop_give_ifni_to_INA:0 "Cede Sidi Ifni to North Africa"
 iop_give_ifni_to_IMR:0 "Cede Sidi Ifni to Morocco"
 iop_egypt_suez_title:0 "Fall of Suez Canal"
 iop_egypt_446_desc:0 "The Suez Canal is under Italian control. Do we integrate this vital waterway into Italy proper, or cede its administration to the Egyptian occupation government?"
 iop_give_suez_to_IEG:0 "Give Suez to Egypt"
 iop_spain_gibraltar_title:0 "Fall of Gibraltar"
 iop_spain_118_desc:0 "The Rock of Gibraltar is under Italian control. Do we integrate this key to the Mediterranean into Italy proper, or cede its administration to the Spanish occupation government?"
 iop_give_gibraltar_to_ISP:0 "Give Gibraltar to Spain"
 iop_give_gibraltar_to_ISP_iberia:0 "Give Gibraltar to Iberia"
 iop_spain_baleares_title:0 "Fate of the Balearic Islands"
 iop_spain_177_desc:0 "The Balearic Islands are under Italian control. Do we integrate them into Italy proper, or cede their administration to the Spanish occupation government?"
 iop_give_baleares_to_ISP:0 "Cede the Balearics to Spain"
 iop_give_baleares_to_ISP_iberia:0 "Cede the Balearics to Iberia"
 iop_portugal_canarias_title:0 "Fate of the Canary Islands"
 iop_portugal_178_desc:0 "The Canary Islands are under Italian control. Do we integrate them into Italy proper, or cede their administration to the Spanish occupation government?"
 iop_give_canarias_to_ISP:0 "Cede the Canaries to Spain"
 iop_give_canarias_to_ISP_iberia:0 "Cede the Canaries to Iberia"
 iop_portugal_azores_title:0 "Fate of Azores and Madeira"
 iop_portugal_698_desc:0 "The Atlantic islands of the Azores and Madeira are under Italian control. Do we integrate them into Italy proper, or cede their administration to the Portuguese or Spanish occupation government?"
 iop_give_azores_to_IPG:0 "Cede the islands to Portugal"
 iop_give_azores_to_ISP:0 "Cede the islands to Spain"
 iop_give_azores_to_ISP_iberia:0 "Cede the islands to Iberia"
 iop_occitania_provence_title:0 "Fate of Provence"
 iop_occitania_32_desc:0 "Alpes and Bouches-du-Rhône are under Italian control. Do we integrate Provence into Italy proper, or cede its administration to the Occitan occupation government?"
 iop_give_provence_to_IOC:0 "Cede Provence to Occitania"
 iop_occitania_savoy_var_title:0 "Fate of Savoy and Var"
 iop_occitania_735_desc:0 "Savoy and Var are under Italian control. Do we integrate them into Italy proper, or cede their administration to the Occitan occupation government?"
 iop_give_savoy_var_to_IOC:0 "Cede Savoy and Var to Occitania"
 iop_occitania_corsica_title:0 "Fate of Corsica"
 iop_occitania_1_desc:0 "Corsica is under Italian control. Do we integrate the island into Italy proper, or cede its administration to the Occitan occupation government?"
 iop_give_corsica_to_IOC:0 "Cede Corsica to Occitania"
 iop_levant_hatay_title:0 "Fate of Hatay"
 iop_levant_799_desc:0 "Hatay is under Italian control. Should the Turkish or the Levantine occupation government administer it?"
 iop_give_hatay_to_ITR:0 "Cede Hatay to Turkey"
 iop_give_hatay_to_ILV:0 "Cede Hatay to the Levant"
 iop_levant_sinai_title:0 "Fate of Sinai"
 iop_levant_453_desc:0 "The Sinai peninsula is under Italian control. Do we integrate it into Italy proper, or cede its administration to the Levantine or the Egyptian occupation government?"
 iop_give_sinai_to_ILV:0 "Cede Sinai to the Levant"
 iop_give_sinai_to_IEG:0 "Cede Sinai to Egypt"
 iop_levant_cyprus_title:0 "Fate of Cyprus"
 iop_levant_183_desc:0 "Cyprus is under Italian control. Do we integrate the island into Italy proper, or cede its administration to the Turkish, Levantine or Greek occupation government?"
 iop_give_cyprus_to_ITR:0 "Cede Cyprus to Turkey"
 iop_give_cyprus_to_ILV:0 "Cede Cyprus to the Levant"
 iop_give_cyprus_to_IGR:0 "Cede Cyprus to Greece"
 iop_arabia_kuwait_title:0 "Fate of Kuwait"
 iop_arabia_656_desc:0 "Kuwait is under Italian control. Do we integrate it into Italy proper, or cede its administration to the Iraqi or the Arabian occupation government?"
 iop_give_kuwait_to_IIQ:0 "Cede Kuwait to Iraq"
 iop_give_kuwait_to_IAR:0 "Cede Kuwait to Arabia"
 iop_armenia_trabzon_van_title:0 "Fate of Trabzon and Van"
 iop_armenia_354_desc:0 "Trabzon and Van are under Italian control. Should the Turkish or the Armenian occupation government administer them?"
 iop_give_trabzon_van_to_ITR:0 "Cede Trabzon and Van to Turkey"
 iop_give_trabzon_van_to_IAM:0 "Cede Trabzon and Van to Armenia"
 iop_greece_dobrudja_title:0 "Fate of Dobrudja"
 iop_greece_77_desc:0 "Dobrudja is under Italian control. Do we integrate it into Italy proper, or cede its administration to the Bulgarian occupation government?"
 iop_give_dobrudja_to_IBL:0 "Cede Dobrudja to Bulgaria"
 iop_yugo_44_desc:0 "Albania is under Italian control. Which occupation government should administer it? Only occupation governments bordering the state are eligible."
 iop_yugo_805_desc:0 "Northern Epirus is under Italian control. Which occupation government should administer it? Only Albania or Greece are eligible, and only if bordering the state."
 iop_yugo_montenegro_fall_title:0 "Fall of Montenegro"
 iop_yugo_montenegro_fall_desc:0 "Montenegrin resistance has collapsed and the territory lies under Italian control. Shall it be integrated into a neighboring occupation government, or shall a new Montenegrin occupation government be raised in its place?"
 iop_integrate_montenegro_ICR:0 "Integrate into Croatia"
 iop_integrate_montenegro_ISE:0 "Integrate into Serbia"
 iop_integrate_montenegro_IAL:0 "Integrate into Albania"
 iop_create_montenegro_govt:0 "Create a new occupational government"

 iop_africa_spanish_africa_title:0 "Fate of Spanish Africa"
 iop_africa_290_desc:0 "Spanish Africa is under Italian control. Do we annex it into Italy proper, or cede its administration to the North African or Moroccan occupation government?"
 iop_give_spanish_africa_to_INA:0 "Cede Spanish Africa to North Africa"
 iop_give_spanish_africa_to_IMR:0 "Cede Spanish Africa to Morocco"
 iop_africa_rio_de_oro_title:0 "Fate of Rio de Oro"
 iop_africa_699_desc:0 "Rio de Oro is under Italian control. Do we annex it into Italy proper, or cede its administration to the North African or Moroccan occupation government?"
 iop_give_rio_de_oro_to_INA:0 "Cede Rio de Oro to North Africa"
 iop_give_rio_de_oro_to_IMR:0 "Cede Rio de Oro to Morocco"
 iop_arabia_oman_title:0 "Fate of Oman"
 iop_arabia_294_desc:0 "The Omani coast is under Italian control. Shall the territory pass to the Arabian occupation government, or shall the Sultanate of Oman be restored as a separate military occupation under Sultan Said bin Taimur?"
 iop_give_oman_to_IAR:0 "Cede the coast to Arabia"
 iop_establish_oman_sultanate:0 "Restore the Sultanate of Oman"
 iop_give_oman_to_IOM:0 "Cede the coast to the Sultanate"
 iop_greece_north_dobrudja_title:0 "Fate of Northern Dobruja"
 iop_greece_971_desc:0 "Northern Dobruja is under Italian control. Do we annex it into Italy proper, or cede its administration to the Bulgarian occupation government?"
 iop_give_north_dobrudja_to_IBL:0 "Cede Northern Dobruja to Bulgaria"

 iop_turkey_izmit_title:0 "Fate of Izmit"
 iop_turkey_347_desc:0 "Izmit is under Italian control. Which occupation government should administer it, or shall it be integrated into Italy proper?"
 iop_turkey_izmir_title:0 "Fate of Izmir"
 iop_turkey_339_desc:0 "Izmir is under Italian control. Which occupation government should administer it, or shall it be integrated into Italy proper?"
 iop_turkey_antalya_title:0 "Fate of Antalya"
 iop_turkey_342_desc:0 "Antalya is under Italian control. Which occupation government should administer it, or shall it be integrated into Italy proper?"
 iop_give_to_ITR:0 "Cede to Turkey"
