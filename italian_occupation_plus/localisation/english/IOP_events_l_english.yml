 iop_yugo_804_desc:0 "Herzegovina is under Italian control. Which occupation government should administer it? Only occupation governments bordering the state are eligible."
 iop_yugo_105_desc:0 "Montenegro is under Italian control. Which occupation government should administer it? Only occupation governments bordering the state are eligible."
 iop_yugo_107_desc:0 "Serbia is under Italian control. Which occupation government should administer it? Only occupation governments bordering the state are eligible."
 iop_yugo_45_desc:0 "Vojvodina is under Italian control. Which occupation government should administer it? Only Croatia or Serbia are eligible, and only if bordering the state."
 iop_yugo_764_desc:0 "West Banat is under Italian control. Which occupation government should administer it? Only Croatia or Serbia are eligible, and only if bordering the state."
 iop_yugo_802_desc:0 "Kosovo is under Italian control. Which occupation government should administer it? Only occupation governments bordering the state are eligible."
 iop_yugo_803_desc:0 "Southern Serbia is under Italian control. Which occupation government should administer it? Only occupation governments bordering the state are eligible."
 iop_yugo_106_desc:0 "Macedonia is under Italian control. Which occupation government should administer it? Only occupation governments bordering the state are eligible."
 iop_yugo_970_desc:0 "Debar is under Italian control. Which occupation government should administer it? Only occupation governments bordering the state are eligible."
 iop_yugo_163_desc:0 "Zara is an Italian city on the Dalmatian coast. Do we confirm its annexation to the Kingdom of Italy, or cede its administration to the Croatian occupation government?"
 iop_yugo_852_desc:0 "Istria is under Italian control. Do we confirm its annexation to the Kingdom of Italy, or cede its administration to the Croatian occupation government?"

