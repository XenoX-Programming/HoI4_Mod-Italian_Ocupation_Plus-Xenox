l_english:
 # ------------------------------------------------------------
 # Governor appointment system (v0.0.37)
 # ------------------------------------------------------------
 iop_governors:0 "Governorates"
 iop_governors_desc:0 "Recall and replace the governors of Italy's occupation governments. Every appointment decides how a zone is run, and what Rome gets out of it."

 iop_gov_order:0 "Proconsular Rule"
 iop_gov_order_desc:0 "Zones run by generals of the Royal Army: cheaper garrisons and resistance broken by the army, in every proconsular zone."
 iop_gov_legit:0 "Collaborationist Rule"
 iop_gov_legit_desc:0 "Zones run through local figures and monarchs: compliance comes faster, but the subject governments grow used to having their own way."
 iop_gov_party:0 "Party Rule"
 iop_gov_party_desc:0 "Zones run by Party appointees: more political power and more resources squeezed out, and more resentment with them."

 iop_gov_order_tt:0 "The Italian general keeps the zone: adds Proconsular Rule to the Occupation Directorate - cheaper garrisons, less resistance."
 iop_gov_legit_tt:0 "A native of the country takes the office: adds Collaborationist Rule to the Occupation Directorate - faster compliance, faster subject autonomy gain."
 iop_gov_party_tt:0 "A Party man takes the office: adds Party Rule to the Occupation Directorate - political power and resources, and more resistance."

 iop_governor_order:0 "Military Government"
 iop_governor_order_desc:0 "The governor is a general of the Royal Army. Orders are obeyed, nobody is consulted, and the garrison does the talking."
 iop_governor_legit:0 "National Government"
 iop_governor_legit_desc:0 "The governor is a native of the country he administers, lent to Rome by the local political nation. Useful, and ambitious."
 iop_governor_party:0 "Fascist Administration"
 iop_governor_party_desc:0 "The governor is a Party man: the fascio runs the ministries, the requisitions and the lists of names."

 iop_gov_1_title:0 "The Government of Croatia"
 iop_gov_1_desc:0 "Zagreb is quiet and the Ustaše are impatient. Bastianini's office already runs the coast; the Poglavnik has waited in Rome since 1929 for the word, and the Party would rather send a ras of its own."
 iop_gov_1_a:0 "Keep Bastianini in Zagreb"
 iop_gov_1_b:0 "Back Ante Pavelić"
 iop_gov_1_c:0 "Send Roberto Farinacci"
 IOP_gov_croatia_legit_desc:0 "Poglavnik of the Ustaše, kept in Rome since 1929. He brings the movement's militia, its quarrels and its own idea of what Croatia is."
 IOP_gov_croatia_party_desc:0 "Ras of Cremona and the loudest voice on the Grand Council. He would run Croatia as a fascio: requisitions, Blackshirts and no excuses."
 iop_replace_governor_croatia:0 "Replace the Governor of Croatia"
 iop_replace_governor_croatia_desc:0 "Recall the governor of Croatia and appoint another man to the office in Zagreb. Costs 50 political power."

 iop_gov_2_title:0 "The Government of Serbia"
 iop_gov_2_desc:0 "Belgrade's gendarmerie answers to Nedić, but the Zborists drill in the streets and the old Radicals would like their pre-war premier back."
 iop_gov_2_a:0 "Keep Nedić in Belgrade"
 iop_gov_2_b:0 "Back Dimitrije Ljotić"
 iop_gov_2_c:0 "Send Alessandro Pavolini"
 IOP_gov_serbia_legit_desc:0 "Leader of Zbor and of the Serbian Volunteer Corps. Orthodox, corporatist, and until now entirely without a foreign sponsor."
 IOP_gov_serbia_party_desc:0 "Fascist Party secretary and former minister of popular culture. He believes occupied Serbia is a school for the Blackshirt generation."
 iop_replace_governor_serbia:0 "Replace the Governor of Serbia"
 iop_replace_governor_serbia_desc:0 "Recall the governor of Serbia and appoint another man to the office in Belgrade. Costs 50 political power."

 iop_gov_3_title:0 "The Government of Montenegro"
 iop_gov_3_desc:0 "Pirzio Biroli holds the mountains with the army. The federalists offer a Green government of their own, and the Party has a hero to spare."
 iop_gov_3_a:0 "Keep Pirzio Biroli in Cetinje"
 iop_gov_3_b:0 "Back Sekula Drljević"
 iop_gov_3_c:0 "Send Ettore Muti"
 IOP_gov_montenegro_legit_desc:0 "Montenegrin federalist who signed for the Greens in 1941. He offers a Montenegro that is neither Serbian nor Italian, only nominally either."
 IOP_gov_montenegro_party_desc:0 "Aviator, gold medallist and famously good company. Rome believes his smile is worth a division."
 iop_replace_governor_montenegro:0 "Replace the Governor of Montenegro"
 iop_replace_governor_montenegro_desc:0 "Recall the governor of Montenegro and appoint another man to the office in Cetinje. Costs 50 political power."

 iop_gov_4_title:0 "The Government of Albania"
 iop_gov_4_desc:0 "Tirana's ministries are Italian-staffed and the clans are watching. Vërlaci knows every one of them; the Party secretary wants Albania run as a fascio, not as a protectorate."
 iop_gov_4_a:0 "Keep Guzzoni in Tirana"
 iop_gov_4_b:0 "Back Shefqet Vërlaci"
 iop_gov_4_c:0 "Send Carlo Scorza"
 IOP_gov_albania_legit_desc:0 "The great landowner of Elbasan and prime minister of Albania under Italian protection. He knows exactly what every clan in the country wants."
 IOP_gov_albania_party_desc:0 "Party secretary in the Fascist Party's last years, and a believer that Albania is a fascio which has not yet been told."
 iop_replace_governor_albania:0 "Replace the Governor of Albania"
 iop_replace_governor_albania_desc:0 "Recall the governor of Albania and appoint another man to the office in Tirana. Costs 50 political power."

 iop_gov_5_title:0 "The Government of Bulgaria"
 iop_gov_5_desc:0 "Sofia's regency is willing to talk. Filov understands Berlin as well as Rome, and the Party treasurer has taken a professional interest in the Bulgarian state railway."
 iop_gov_5_a:0 "Keep Biseo in Sofia"
 iop_gov_5_b:0 "Back Bogdan Filov"
 iop_gov_5_c:0 "Send Giovanni Marinelli"
 IOP_gov_bulgaria_legit_desc:0 "Archaeologist, prime minister and regent of Bulgaria. He understands Berlin, the Balkans and the value of being indispensable."
 IOP_gov_bulgaria_party_desc:0 "Fascist Party treasurer since 1921, and a man who reads a national budget the way other men read poetry."
 iop_replace_governor_bulgaria:0 "Replace the Governor of Bulgaria"
 iop_replace_governor_bulgaria_desc:0 "Recall the governor of Bulgaria and appoint another man to the office in Sofia. Costs 50 political power."

 iop_gov_6_title:0 "The Government of Greece"
 iop_gov_6_desc:0 "De Vecchi has Athens but not the countryside. Rallis can deliver the old political class, and the Party's youth organiser would rather deliver the Peloponnese by force."
 iop_gov_6_a:0 "Keep De Vecchi in Athens"
 iop_gov_6_b:0 "Back Ioannis Rallis"
 iop_gov_6_c:0 "Send Renato Ricci"
 IOP_gov_greece_legit_desc:0 "Old politician of the Greek right, ready to serve any order that keeps the communists out of Athens."
 IOP_gov_greece_party_desc:0 "Blackshirt general and creator of the Balilla youth movement. He intends to raise Greek youth in the Italian manner."
 iop_replace_governor_greece:0 "Replace the Governor of Greece"
 iop_replace_governor_greece_desc:0 "Recall the governor of Greece and appoint another man to the office in Athens. Costs 50 political power."

 iop_gov_7_title:0 "The Government of Turkey"
 iop_gov_7_desc:0 "Graziani sits at Ankara and nobody loves him for it. Nuri Pasha dreams of Turkestan, and Ciano would rather settle the Straits with a treaty than with a garrison."
 iop_gov_7_a:0 "Keep Graziani in Ankara"
 iop_gov_7_b:0 "Back Nuri Killigil"
 iop_gov_7_c:0 "Send Galeazzo Ciano"
 IOP_gov_turkey_legit_desc:0 "Enver Pasha's brother, pan-Turanist and arms manufacturer. He dreams of Turkestan and needs an army to get there."
 IOP_gov_turkey_party_desc:0 "Foreign minister, son-in-law of the Duce and the most charming man in Rome. He would rather sign the Straits than garrison them."
 iop_replace_governor_turkey:0 "Replace the Governor of Turkey"
 iop_replace_governor_turkey_desc:0 "Recall the governor of Turkey and appoint another man to the office in Ankara. Costs 50 political power."

 iop_gov_8_title:0 "The Government of North Africa"
 iop_gov_8_desc:0 "Bastico administers Tripoli. The Senussi emir sits in Cairo waiting to be talked to, and there are Italians who remember an air marshal who would have done all of this better."
 iop_gov_8_a:0 "Keep Bastico in Tripoli"
 iop_gov_8_b:0 "Back Idris I of Cyrenaica"
 iop_gov_8_c:0 "Send Italo Balbo"
 IOP_gov_north_africa_legit_desc:0 "Emir of the Senussi, who fought Italy for twenty years and has sat in exile in Cairo ever since. Rome is prepared to be realistic if he is."
 IOP_gov_north_africa_party_desc:0 "Governor of Libya, aviator, quadrumvir - and alive. He already ruled this coast once, with roads and settlers rather than police."
 iop_replace_governor_north_africa:0 "Replace the Governor of North Africa"
 iop_replace_governor_north_africa_desc:0 "Recall the governor of North Africa and appoint another man to the office in Tripoli. Costs 50 political power."

 iop_gov_9_title:0 "The Government of Egypt"
 iop_gov_9_desc:0 "Cairo's palace makes its own politics. Ali Mahir kept the British at arm's length; al-Misri kept in touch with Berlin, and would be happy to keep in touch with Rome as well."
 iop_gov_9_a:0 "Keep King Farouk in Cairo"
 iop_gov_9_b:0 "Back Ali Mahir Pasha"
 iop_gov_9_c:0 "Send Aziz Ali al-Misri"
 IOP_gov_egypt_legit_desc:0 "Cairo prime minister who kept the British at arm's length and the Axis on the telephone."
 IOP_gov_egypt_party_desc:0 "Egyptian staff general and conspirator, in contact with Berlin since 1940. He wants an Egyptian army, not an Italian one - but the first step is the same."
 iop_replace_governor_egypt:0 "Replace the Governor of Egypt"
 iop_replace_governor_egypt_desc:0 "Recall the governor of Egypt and appoint another man to the office in Cairo. Costs 50 political power."

 iop_gov_10_title:0 "The Government of Spain"
 iop_gov_10_desc:0 "Roatta's staff occupies Madrid. Serrano Suñer speaks for the Falange, and Grandi arrives with a suitcase of promises and a career to rebuild."
 iop_gov_10_a:0 "Keep Roatta in Madrid"
 iop_gov_10_b:0 "Back Ramón Serrano Suñer"
 iop_gov_10_c:0 "Send Dino Grandi"
 IOP_gov_spain_legit_desc:0 "The Cuñadísimo: Falangist, brother-in-law of Franco and the most Axis-minded man in Madrid."
 IOP_gov_spain_party_desc:0 "Grandi of Bologna: former foreign minister and ambassador, and a man who has never forgotten that an empire needs competent management."
 iop_replace_governor_spain:0 "Replace the Governor of Spain"
 iop_replace_governor_spain_desc:0 "Recall the governor of Spain and appoint another man to the office in Madrid. Costs 50 political power."

 iop_gov_11_title:0 "The Government of Portugal"
 iop_gov_11_desc:0 "Lisbon is a city of exiles and refugees, worth more quiet than noise. Salazar would stay if he could keep the books; Preziosi would not."
 iop_gov_11_a:0 "Keep Rolão Preto in Lisbon"
 iop_gov_11_b:0 "Back António de Oliveira Salazar"
 iop_gov_11_c:0 "Send Giovanni Preziosi"
 IOP_gov_portugal_legit_desc:0 "The Professor of Coimbra who has run Portugal's finances since 1932. He stays - on the condition that Lisbon remains a quiet city."
 IOP_gov_portugal_party_desc:0 "Fascist ideologue and race theorist, consistently wrong about everything except who was winning."
 iop_replace_governor_portugal:0 "Replace the Governor of Portugal"
 iop_replace_governor_portugal_desc:0 "Recall the governor of Portugal and appoint another man to the office in Lisbon. Costs 50 political power."

 iop_gov_12_title:0 "The Government of Occitania"
 iop_gov_12_desc:0 "Bordeaux looks south to Madrid and east to Vichy. Pétain's name still opens doors in the Midi; Darnand's men open them at night."
 iop_gov_12_a:0 "Keep Navarini in Bordeaux"
 iop_gov_12_b:0 "Back Philippe Pétain"
 iop_gov_12_c:0 "Send Joseph Darnand"
 IOP_gov_occitania_legit_desc:0 "The Marshal of Verdun, chief of the French State, and the only name in France that still commands obedience."
 IOP_gov_occitania_party_desc:0 "Chief of the Milice, a soldier who never accepted the armistice. He would police the Midi with Frenchmen rather than Italians."
 iop_replace_governor_occitania:0 "Replace the Governor of Occitania"
 iop_replace_governor_occitania_desc:0 "Recall the governor of Occitania and appoint another man to the office in Bordeaux. Costs 50 political power."

 iop_gov_13_title:0 "The Government of the Levant"
 iop_gov_13_desc:0 "Jerusalem, Damascus and Beirut in one administration. The Mufti has waited in Berlin for exactly this; the Latin Patriarch has waited in Jerusalem for rather longer."
 iop_gov_13_a:0 "Keep Shakib Arslan in Damascus"
 iop_gov_13_b:0 "Back Haj Amin al-Husseini"
 iop_gov_13_c:0 "Send Luigi Barlassina"
 IOP_gov_levant_legit_desc:0 "Grand Mufti of Jerusalem, in exile in Berlin since 1941, waiting to return in somebody's aircraft."
 IOP_gov_levant_party_desc:0 "Latin Patriarch of Jerusalem since 1920: Italian, outspoken, and entirely convinced that the Holy Land belongs in Rome's orbit."
 iop_replace_governor_levant:0 "Replace the Governor of Levant"
 iop_replace_governor_levant_desc:0 "Recall the governor of the Levant and appoint another man to the office in Damascus. Costs 50 political power."

 iop_gov_14_title:0 "The Government of Iraq"
 iop_gov_14_desc:0 "Baghdad remembers its coup fondly. Qawuqji led the men who fought the British in 1941; De Bono is older than the country he would govern and knows what the oil is worth."
 iop_gov_14_a:0 "Keep Rashid Ali in Baghdad"
 iop_gov_14_b:0 "Back Fawzi al-Qawuqji"
 iop_gov_14_c:0 "Send Emilio De Bono"
 IOP_gov_iraq_legit_desc:0 "Arab nationalist officer who led the fighting in Iraq in 1941 and has never signed anything since."
 IOP_gov_iraq_party_desc:0 "Quadrumvir of the March on Rome, marshal of Italy and colonial minister. He remembers when Baghdad was a railway siding with potential."
 iop_replace_governor_iraq:0 "Replace the Governor of Iraq"
 iop_replace_governor_iraq_desc:0 "Recall the governor of Iraq and appoint another man to the office in Baghdad. Costs 50 political power."

 iop_gov_15_title:0 "The Government of Arabia"
 iop_gov_15_desc:0 "Riyadh does not love Rome and the roads are very long. A Hashemite claimant would legitimise the Hejaz; Lessona's ministry has already drafted the concession terms."
 iop_gov_15_a:0 "Keep Nasi in Riyadh"
 iop_gov_15_b:0 "Back Zeid bin Hussein"
 iop_gov_15_c:0 "Send Alessandro Lessona"
 IOP_gov_arabia_legit_desc:0 "Hashemite prince, son of the Sharif of Mecca and the last credible claimant to the Hejazi throne."
 IOP_gov_arabia_party_desc:0 "Minister of Italian Africa who organised Italy's colonial administration in the 1930s. He would organise Arabia the same way."
 iop_replace_governor_arabia:0 "Replace the Governor of Arabia"
 iop_replace_governor_arabia_desc:0 "Recall the governor of Arabia and appoint another man to the office in Riyadh. Costs 50 political power."

 iop_gov_16_title:0 "The Government of Armenia"
 iop_gov_16_desc:0 "Yerevan is one province with a very long memory. Nzhdeh has fought everyone in turn and would fight for anyone; Marinetti has decided that Armenia is the modern thing."
 iop_gov_16_a:0 "Keep Dro in Yerevan"
 iop_gov_16_b:0 "Back Garegin Nzhdeh"
 iop_gov_16_c:0 "Send Filippo Tommaso Marinetti"
 IOP_gov_armenia_legit_desc:0 "Dashnak commander of Zangezur, who has fought the Turks, the Soviets and his own party's enemies. He offers Armenia an army again."
 IOP_gov_armenia_party_desc:0 "Founder of Futurism, poet of the machine age, still volunteering at sixty-five. He has decided that Armenia is the most modern thing left in Asia."
 iop_replace_governor_armenia:0 "Replace the Governor of Armenia"
 iop_replace_governor_armenia_desc:0 "Recall the governor of Armenia and appoint another man to the office in Yerevan. Costs 50 political power."

 iop_gov_17_title:0 "The Government of Iran"
 iop_gov_17_desc:0 "Tehran's railway was built to move out oil, not armies. Zahedi has spent the war quietly on the German side of the telephone; Count Volpi has been counting barrels since 1920."
 iop_gov_17_a:0 "Keep Reza Shah in Tehran"
 iop_gov_17_b:0 "Back Fazlollah Zahedi"
 iop_gov_17_c:0 "Send Giuseppe Volpi"
 IOP_gov_iran_legit_desc:0 "Iranian general arrested by the British in 1941 for his German friends - and therefore, from Rome's point of view, a man of proven taste."
 IOP_gov_iran_party_desc:0 "Count Volpi di Misurata, the financier who built half of Iran's railways and knows exactly what a barrel of oil is worth."
 iop_replace_governor_iran:0 "Replace the Governor of Iran"
 iop_replace_governor_iran_desc:0 "Recall the governor of Iran and appoint another man to the office in Tehran. Costs 50 political power."

 iop_gov_18_title:0 "The Government of Morocco"
 iop_gov_18_desc:0 "Casablanca is a harbour with a country attached. El Glaoui rules Marrakesh from a bicycle, and Federzoni has a doctrine for exactly this sort of place."
 iop_gov_18_a:0 "Keep Torres in Casablanca"
 iop_gov_18_b:0 "Back Thami El Glaoui"
 iop_gov_18_c:0 "Send Luigi Federzoni"
 IOP_gov_morocco_legit_desc:0 "Pasha of Marrakesh and the most powerful lord in southern Morocco, who has never lost an argument with a sultan."
 IOP_gov_morocco_party_desc:0 "Former Nationalist leader and colonial minister: an imperialist of the older, more literate school."
 iop_replace_governor_morocco:0 "Replace the Governor of Morocco"
 iop_replace_governor_morocco_desc:0 "Recall the governor of Morocco and appoint another man to the office in Casablanca. Costs 50 political power."

 iop_gov_19_title:0 "The Government of Oman"
 iop_gov_19_desc:0 "Muscat is quiet and the interior is not. The Imam's men hold the oases, and a scholar from Rome would rather map the country than fight for it."
 iop_gov_19_a:0 "Keep the Sultan in Muscat"
 iop_gov_19_b:0 "Back Muhammad al-Khalili"
 iop_gov_19_c:0 "Send Giuseppe Tucci"
 IOP_gov_oman_legit_desc:0 "Ibadi Imam of Oman's interior, elected in 1920, who has never recognised the Sultan's treaties with anybody."
 IOP_gov_oman_party_desc:0 "Orientalist from Rome who has travelled the East alone. He would rather survey Oman than garrison it."
 iop_replace_governor_oman:0 "Replace the Governor of Oman"
 iop_replace_governor_oman_desc:0 "Recall the governor of Oman and appoint another man to the office in Muscat. Costs 50 political power."

