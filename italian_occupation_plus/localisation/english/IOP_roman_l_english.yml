l_english:
 iop_give_to_ITR:0 "Give to the Turkish Occupation Government"
 autonomy_province:0 "Province"
 autonomy_province_desc:0 "A province of the restored Roman Empire. Fully integrated into the imperial economy - everything flows to Rome, in exchange for order and investment."
 ITA_roman:0 "Imperium Romanum"
 ITA_roman_DEF:0 "the Roman Empire"
 ITA_roman_ADJ:0 "Roman"
 ITA_roman_fascism:0 "Imperium Romanum"
 ITA_roman_fascism_DEF:0 "the Roman Empire"
 ITA_roman_fascism_ADJ:0 "Roman"
 iop_restore_roman_empire:0 "Restore the Roman Empire"
 iop_restore_roman_empire_desc:0 "The Mediterranean is an Italian lake. Proclaim the restoration of the Empire and reduce the occupation governments to provinces of Rome."
 iop_roman_1_title:0 "The Empire Restored"
 iop_roman_1_desc:0 "With every shore of the Mediterranean under the fasces, the King-Empress proclaims the restoration of the Roman Empire. The occupation governments are reorganised as provinces."
 iop_roman_1_a:0 "Roma invicta."
 iop_roman_province_tt:0 "Every occupation government becomes a §YProvince§! of the Empire."
 iop_decide_347_izmit:0 "Determine Fate of Izmit"
 iop_decide_347_izmit_desc:0 "Izmit guards the Bosphorus approach. Decide whether Greece or Turkey receives it, or annex it to Italy."
 iop_decide_339_izmir:0 "Determine Fate of Izmir"
 iop_decide_339_izmir_desc:0 "Izmir, the pearl of the Aegean coast. Decide whether Greece or Turkey receives it, or annex it to Italy."
 iop_decide_342_antalya:0 "Determine Fate of Antalya"
 iop_decide_342_antalya_desc:0 "Antalya commands the southern Anatolian coast. Annex it to Italy, or cede it to Turkey or Greece."
 iop_turkey_izmit_title:0 "The Fate of Izmit"
 iop_turkey_347_desc:0 "The garrison reports Izmit is pacified. Rome must decide its recipient."
 iop_turkey_izmir_title:0 "The Fate of Izmir"
 iop_turkey_339_desc:0 "The Aegean coast is quiet. Rome must decide who receives Izmir."
 iop_turkey_antalya_title:0 "The Fate of Antalya"
 iop_turkey_342_desc:0 "Antalya is under Italian control. Rome may annex it or hand it to a neighbour."
