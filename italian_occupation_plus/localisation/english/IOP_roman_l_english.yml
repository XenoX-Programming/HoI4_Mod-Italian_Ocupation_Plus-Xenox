 # Decisions & Events
 iop_restore_roman_empire:0 "Restore the Roman Empire"
 iop_restore_roman_empire_desc:0 "The Mediterranean is an Italian lake. Proclaim the restoration of the Empire, rechristening Italy as Imperivm Romanvm and reorganising the occupation governments as imperial provinces."
 iop_roman_1_title:0 "The Empire Restored"
 iop_roman_1_desc:0 "With every shore of the Mediterranean under the fasces, the restoration of the Imperivm Romanvm is proclaimed from Rome. The military occupation governments are reorganised as imperial provinces."
 iop_roman_1_a:0 "Roma invicta."
 iop_roman_province_tt:0 "Italy becomes §YImperivm Romanvm§!, and every occupation government becomes an imperial §YProvince§!."
