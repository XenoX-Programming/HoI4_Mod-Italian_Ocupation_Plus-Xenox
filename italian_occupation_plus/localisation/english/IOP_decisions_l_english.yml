l_english:
 iop_occupation:0 "Italian Occupation"
 iop_occupation_desc:0 "Establish Italian military occupation governments in conquered Yugoslav territory, then assign bordering states to them. All decisions are free."

 iop_establish_croatia:0 "Establish Military Occupation of Croatia"
 iop_establish_croatia_desc:0 "Requires control of Croatia (Zagreb). Releases ICR as an Italian puppet with cores on Croatia, Bosnia and Herzegovina (Dalmatia has its own fate decision). Any of those states under Italian control transfer automatically."
 iop_establish_croatia_tt:0 "Releases §YICR§! - Governo Militare di Occupazione della Croazia - as our puppet."

 iop_establish_serbia:0 "Establish Military Occupation of Serbia"
 iop_establish_serbia_desc:0 "Requires control of Serbia (Belgrade). Releases ISE as an Italian puppet with cores on Serbia and Morava. Controlled states transfer automatically."
 iop_establish_serbia_tt:0 "Releases §YISE§! - Governo Militare di Occupazione della Serbia - as our puppet."


 iop_decide_102:0 "Determine Fate of North Slovenia"
 iop_decide_102_desc:0 "Decide which occupation government should administer North Slovenia (102). Requires Croatia, Germany or Austria to border the state; eligible recipients are bordering occupation governments (with cores) plus Germany and Austria (plain handover, no cores)."
 iop_decide_853:0 "Determine Fate of Ljubljana"
 iop_decide_853_desc:0 "Cede Ljubljana (853) to the Croatian occupation government, or integrate it into Italy proper. Requires Croatia to own a state bordering Ljubljana."
 iop_decide_103:0 "Determine Fate of Dalmatia"
 iop_decide_103_desc:0 "Cede Dalmatia (103) to the Croatian occupation government, or integrate it into Italy proper. Requires Croatia to own a state bordering Dalmatia."
 iop_decide_109:0 "Determine Fate of Croatia"
 iop_decide_109_desc:0 "Decide which occupation government should administer Croatia (109). Only a bordering occupation government can receive it."
 iop_decide_104:0 "Determine Fate of Bosnia"
 iop_decide_104_desc:0 "Decide which occupation government should administer Bosnia (104). Only a bordering occupation government can receive it."
 iop_decide_804:0 "Determine Fate of Herzegovina"
 iop_decide_804_desc:0 "Decide which occupation government should administer Herzegovina (804). Only a bordering occupation government can receive it."
 iop_decide_105:0 "Reassign Montenegro"
 iop_decide_105_desc:0 "Decide which occupation government should administer Montenegro (105). Only a bordering occupation government can receive it."
 iop_decide_107:0 "Determine Fate of Serbia"
 iop_decide_107_desc:0 "Decide which occupation government should administer Serbia (107). Only a bordering occupation government can receive it."
 iop_decide_45:0 "Determine Fate of Vojvodina"
 iop_decide_45_desc:0 "Decide which occupation government should administer Vojvodina / Backa (45). Only Croatia or Serbia can receive it, and only if bordering the state."
 iop_decide_764:0 "Determine Fate of West Banat"
 iop_decide_764_desc:0 "Decide which occupation government should administer West Banat (764). Only Croatia or Serbia can receive it, and only if bordering the state."
 iop_decide_802:0 "Determine Fate of Kosovo"
 iop_decide_802_desc:0 "Decide which occupation government should administer Kosovo (802). Only a bordering occupation government can receive it."
 iop_decide_803:0 "Determine Fate of Southern Serbia"
 iop_decide_803_desc:0 "Decide which occupation government should administer Southern Serbia (803). Requires Serbia or Bulgaria to border the state; only a bordering occupation government can receive it."
 iop_decide_106:0 "Determine Fate of Macedonia"
 iop_decide_106_desc:0 "Decide which occupation government should administer Macedonia (106). Requires Serbia or Bulgaria to border the state; only a bordering occupation government can receive it."
 iop_decide_970:0 "Determine Fate of Debar"
 iop_decide_970_desc:0 "Decide which occupation government should administer Debar (970). Only a bordering occupation government can receive it."
 iop_decide_163_zara:0 "Determine Fate of Zara"
 iop_decide_163_zara_desc:0 "Cede Zara (163) to the Croatian occupation government, or confirm its annexation to Italy. Requires Croatia to border Zara."
 iop_decide_852_istria:0 "Determine Fate of Istria"
 iop_decide_852_istria_desc:0 "Cede Istria (852) to the Croatian occupation government, or confirm its annexation to Italy. Requires Croatia to border Istria."
 iop_establish_albania:0 "Establish Military Occupation of Albania"
 iop_establish_albania_desc:0 "Requires control of Albania (Tirana). Releases IAL as an Italian puppet with cores on Albania and Shkoder. Controlled states transfer automatically."
 iop_establish_albania_tt:0 "Releases §YIAL§! - Governo Militare di Occupazione dell'Albania - as our puppet."
 iop_establish_bulgaria:0 "Establish Military Occupation of Bulgaria"
 iop_establish_bulgaria_desc:0 "Requires control of Sofia. Releases IBL as an Italian puppet with cores on Sofia, Moesia, Plovdiv and Burgas. Controlled states transfer automatically."
 iop_establish_bulgaria_tt:0 "Releases §YIBL§! - Governatorato di occupazione militare della Bulgaria - as our puppet."
 iop_fall_of_montenegro:0 "Fall of Montenegro"
 iop_fall_of_montenegro_desc:0 "Montenegro is under Italian control. Integrate it into a neighboring occupation government, or raise a new Montenegrin occupation government."
 iop_decide_44:0 "Determine Fate of Albania"
 iop_decide_44_desc:0 "Decide which occupation government should administer Albania (44). Only a bordering occupation government can receive it."
 iop_decide_805:0 "Determine Fate of Northern Epirus"
 iop_decide_805_desc:0 "Decide which occupation government should administer Northern Epirus (805). Only Albania or Greece can receive it, and only if bordering the state."
 iop_establish_greece:0 "Establish Military Occupation of Greece"
 iop_establish_greece_desc:0 "Requires control of Attica (Athens). Releases IGR as an Italian puppet with cores on Attica, Peloponnese, Epirus and the Aegean Islands. Controlled states transfer automatically."
 iop_establish_greece_tt:0 "Releases §YIGR§! - Governatorato militare di occupazione della Grecia - as our puppet."
 iop_decide_731:0 "Determine Fate of Central Macedonia"
 iop_decide_731_desc:0 "Decide which occupation government should administer Central Macedonia (731). Only Greece or Bulgaria can receive it, and only if bordering the state."
 iop_decide_184:0 "Determine Fate of Thrace"
 iop_decide_184_desc:0 "Decide which occupation government should administer Thrace (184). Only Greece or Bulgaria can receive it, and only if bordering the state."
 iop_decide_182_crete:0 "Determine Fate of Crete"
 iop_decide_182_crete_desc:0 "Cede Crete (182) to the Greek occupation government, or confirm its annexation to Italy. Requires the Greek occupation government to exist."
 iop_decide_164_dodecanese:0 "Determine Fate of Dodecanese"
 iop_decide_164_dodecanese_desc:0 "Cede Dodecanese (164) to the Greek or Turkish occupation government, or confirm its annexation to Italy. Requires the Greek or Turkish occupation government to exist."
 iop_establish_turkey:0 "Establish Military Occupation of Turkey"
 iop_establish_turkey_desc:0 "Requires control of Ankara. Releases ITR as an Italian puppet with cores on all of Anatolia - from Izmit and Izmir to Van and Hakkari. Controlled states transfer automatically. (Edirne, Bursa and Istanbul stay Italian until you assign them via their fate decisions.)"
 iop_establish_turkey_tt:0 "Releases §YITR§! - Governo militare di occupazione della Turchia - as our puppet."
 iop_decide_341_edirne:0 "Determine Fate of Edirne"
 iop_decide_341_edirne_desc:0 "Cede Edirne (341) to the Bulgarian or Greek occupation government, or confirm its annexation to Italy. Requires Bulgaria or Greece to border Edirne."
 iop_decide_340_bursa:0 "Determine Fate of Bursa"
 iop_decide_340_bursa_desc:0 "Cede Bursa (340) to the Turkish occupation government, or confirm its annexation to Italy. Requires the Turkish occupation government to border Bursa."
 iop_decide_797_istanbul:0 "Determine Fate of Istanbul"
 iop_decide_797_istanbul_desc:0 "Cede Istanbul (797) to the Turkish occupation government, or confirm its annexation to Italy. Requires the Turkish occupation government to border Istanbul."
 iop_establish_north_africa:0 "Establish Military Occupation of North Africa"
 iop_establish_north_africa_desc:0 "Requires control of Tripoli. Releases INA as an Italian puppet with cores on all of Libya - Tripoli, Tripolitania, El Agheila, Sirte, Benghasi, Derna, Cyrenaica and the Libyan Desert. Controlled states transfer automatically."
 iop_establish_north_africa_tt:0 "Releases §YINA§! - Governatorato di occupazione militare del Nord Africa - as our puppet."
 iop_give_tunisia:0 "Transfer Tunisia to North Africa"
 iop_give_tunisia_desc:0 "Give control of Gabès (665) and Tunisia (458) to the North African occupation government (INA). Requires INA to exist; every controlled state of the group transfers."
 iop_give_algeria:0 "Transfer Algeria to North Africa"
 iop_give_algeria_desc:0 "Give control of Algiers (459), Constantine (460), Tlemcen (513) and the Algerian Desert (514) to the North African occupation government (INA). Requires INA to exist; every controlled state of the group transfers."
 iop_give_morocco:0 "Transfer Morocco to North Africa"
 iop_give_morocco_desc:0 "Give control of Casablanca (461) and Marrakech (462) to the North African occupation government (INA). Requires INA to exist; every controlled state of the group transfers."
 iop_give_spanish_africa:0 "Transfer Spanish Africa to North Africa"
 iop_give_spanish_africa_desc:0 "Give control of Spanish Africa (290) to the North African occupation government (INA). Requires INA to exist."
 iop_decide_783_ifni:0 "Determine Fate of Sidi Ifni"
 iop_decide_783_ifni_desc:0 "Cede Sidi Ifni (783) to the North African occupation government, or integrate it into Italy proper. Requires the North African occupation government to exist."
 iop_establish_egypt:0 "Establish Military Occupation of Egypt"
 iop_establish_egypt_desc:0 "Requires control of Cairo. Releases IEG as an Italian puppet with cores on Matrouh, Alexandria, Cairo, the Western Desert, Aswan and the Eastern Desert. Controlled states transfer automatically. (Suez stays Italian until you assign it via the Fall of Suez Canal; Sinai comes in a later update.)"
 iop_establish_egypt_tt:0 "Releases §YIEG§! - Governo militare di occupazione dell'Egitto - as our puppet."
 iop_give_sudan:0 "Transfer Sudan to Egypt"
 iop_give_sudan_desc:0 "Give control of North Darfur (767), Khartoum (551), Kassala (883), Blue Nile (886), Kurdufan (549), South Darfur (887), Upper Nile (884) and Bahr al Ghazal (885) to the Egyptian occupation government (IEG). Requires IEG to exist; every controlled state of the group transfers."
 iop_fall_of_suez:0 "Fall of Suez Canal"
 iop_fall_of_suez_desc:0 "Suez is under Italian control. Give it to the Egyptian occupation government, or integrate it into Italy proper. Requires Egypt to control a state neighboring Suez."
 iop_establish_spain:0 "Establish Military Occupation of Spain"
 iop_establish_spain_desc:0 "Requires control of Madrid. Releases ISP as an Italian puppet with cores on Galicia, Asturias, León, País Vasco, Navarra, Western and Eastern Aragón, Cataluña, Valladolid, Burgos, Salamanca, Madrid, Guadalajara, Valencia, Extremadura, Ciudad Real, Murcia, Córdoba, Sevilla and Granada. Controlled states transfer automatically. (Gibraltar and the Balearics stay Italian until assigned by their own decisions.)"
 iop_establish_spain_tt:0 "Releases §YISP§! - Governatorato militare di occupazione della Spagna - as our puppet."
 iop_fall_of_gibraltar:0 "Fall of Gibraltar"
 iop_fall_of_gibraltar_desc:0 "Gibraltar is under Italian control. Give it to the Spanish occupation government, or integrate it into Italy proper. Requires Spain to own a state neighboring Gibraltar."
 iop_decide_177_baleares:0 "Determine Fate of the Balearic Islands"
 iop_decide_177_baleares_desc:0 "Cede Islas Baleares (177) to the Spanish occupation government, or integrate them into Italy proper. Islands - requires only that the Spanish occupation government exists."
 iop_establish_portugal:0 "Establish Military Occupation of Portugal"
 iop_establish_portugal_desc:0 "Requires control of Lisbon. Releases IPG as an Italian puppet with cores on Porto, Guarda, Lisbon, Santarém and Beja. Controlled states transfer automatically."
 iop_establish_portugal_tt:0 "Releases §YIPG§! - Governo militare di occupazione del Portogallo - as our puppet."
 iop_decide_178_canarias:0 "Determine Fate of the Canary Islands"
 iop_decide_178_canarias_desc:0 "Cede Islas Canarias (178) to the Spanish occupation government, or integrate them into Italy proper. Islands - requires only that the Spanish occupation government exists."
 iop_decide_698_azores_madeira:0 "Determine Fate of Azores and Madeira"
 iop_decide_698_azores_madeira_desc:0 "Cede the Azores (698) and Madeira (697) to the Portuguese or Spanish occupation government, or integrate them into Italy proper. Islands - each option only requires its recipient to exist; every controlled island transfers."
 iop_unite_iberia:0 "Unite the Iberian Peninsula"
 iop_unite_iberia_desc:0 "Merge our two Iberian occupation governments. Spain annexes Portugal and becomes the Governatorato di occupazione militare della penisola Iberica. Visible once Portugal has been founded and Spain exists; both must still be our subjects."
 iop_unite_iberia_tt:0 "§YISP§! annexes §YIPG§! and becomes the §YGovernatorato di occupazione militare della penisola Iberica§!."
 iop_establish_occitania:0 "Establish Military Occupation of Occitania"
 iop_establish_occitania_desc:0 "Requires control of Aquitaine (Bordeaux). Releases IOC as an Italian puppet with cores on Centre-Sud, Limousin, Aquitaine, Pyrénées-Atlantiques, Midi-Pyrénées, Auvergne, Rhône and Languedoc. Controlled states transfer automatically."
 iop_establish_occitania_tt:0 "Releases §YIOC§! - Governo militare di occupazione dell'Occitania - as our puppet."
 iop_decide_32_provence:0 "Determine Fate of Provence"
 iop_decide_32_provence_desc:0 "Cede Alpes (32) and Bouches-du-Rhône (21) to the Occitan occupation government, or integrate them into Italy proper. Requires Occitania to own a state bordering the group; every controlled state transfers."
 iop_decide_735_savoy_var:0 "Determine Fate of Savoy and Var"
 iop_decide_735_savoy_var_desc:0 "Cede Savoy (735) and Var (851) to the Occitan occupation government, or integrate them into Italy proper. Requires Occitania to own a state bordering the group; every controlled state transfers."
 iop_decide_1_corsica:0 "Determine Fate of Corsica"
 iop_give_poitou:0 "Transfer Poitou to Occitania"
 iop_give_poitou_desc:0 "Give Poitou (23) to the Occitan occupation government (IOC) with a core. No event. Requires IOC to exist and Poitou to be owned or controlled by Italy or one of our subjects."
 iop_decide_1_corsica_desc:0 "Cede Corsica (1) to the Occitan occupation government, or integrate it into Italy proper. Island - requires only that the Occitan occupation government exists."
