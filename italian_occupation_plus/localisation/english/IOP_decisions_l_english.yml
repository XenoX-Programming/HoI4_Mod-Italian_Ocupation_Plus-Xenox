l_english:
 iop_occupation:0 "[ROOT.GetIopCategoryName]"
 iop_occupation_normal:0 "Italian Occupation"
 iop_occupation_roman:0 "Imperivm Romanvm — Imperial Administration"
 iop_occupation_desc:0 "Establish Italian military occupation governments in conquered Yugoslav territory, then assign bordering states to them. All decisions are free."

 iop_establish_croatia:0 "[ROOT.GetEstablishCroatiaName]"
 iop_establish_croatia_normal:0 "Establish Military Occupation of Croatia"
 iop_establish_croatia_roman:0 "Establish Province of Illyricvm"
 iop_establish_croatia_desc:0 "[ROOT.GetEstablishCroatiaDesc]"
 iop_establish_croatia_normal_desc:0 "Requires Italy or its subjects to control Croatia (Zagreb). Releases ICR as an Italian puppet with cores on Croatia, Bosnia and Herzegovina (Dalmatia has its own fate decision). Any of those states controlled by Italy or its subjects transfer automatically."
 iop_establish_croatia_roman_desc:0 "Requires Rome or its provinces to control Zagreb. Reorganises the territory into the imperial province of Illyricvm with cores on Croatia, Bosnia and Herzegovina."
 iop_establish_croatia_tt:0 "Releases §YICR§! - Governo Militare di Occupazione della Croazia - as our puppet."
 iop_establish_croatia_roman_tt:0 "Releases §YICR§! — §YIllyricvm§! — as an imperial Province."

 iop_establish_serbia:0 "[ROOT.GetEstablishSerbiaName]"
 iop_establish_serbia_normal:0 "Establish Military Occupation of Serbia"
 iop_establish_serbia_roman:0 "Establish Province of Moesia Svperior"
 iop_establish_serbia_desc:0 "[ROOT.GetEstablishSerbiaDesc]"
 iop_establish_serbia_normal_desc:0 "Requires Italy or its subjects to control Serbia (Belgrade). Releases ISE as an Italian puppet with cores on Serbia and Morava. Controlled states transfer automatically."
 iop_establish_serbia_roman_desc:0 "Requires Rome or its provinces to control Belgrade. Reorganises the territory into the imperial province of Moesia Svperior."
 iop_establish_serbia_tt:0 "Releases §YISE§! - Governo Militare di Occupazione della Serbia - as our puppet."
 iop_establish_serbia_roman_tt:0 "Releases §YISE§! — §YMoesia Svperior§! — as an imperial Province."


 iop_decide_102:0 "Determine Fate of North Slovenia"
 iop_decide_102_desc:0 "Decide which occupation government should administer North Slovenia (102). Requires Croatia, Germany or Austria to border the state; eligible recipients are bordering occupation governments (with cores) plus Germany and Austria (plain handover, no cores)."
 iop_decide_853:0 "Determine Fate of Ljubljana"
 iop_decide_853_desc:0 "Cede Ljubljana (853) to the Croatian occupation government, or integrate it into Italy proper. Requires Croatia to own a state bordering Ljubljana."
 iop_decide_103:0 "Determine Fate of Dalmatia"
 iop_decide_103_desc:0 "Cede Dalmatia (103) to the Croatian occupation government, or integrate it into Italy proper. Requires Croatia to own a state bordering Dalmatia."
 iop_decide_109:0 "Determine Fate of Croatia"
 iop_decide_109_desc:0 "Decide which occupation government should administer Croatia (109). Only a bordering occupation government can receive it."
 iop_decide_104:0 "Determine Fate of Bosnia"
 iop_decide_104_desc:0 "Decide which occupation government should administer Bosnia (104). Only a bordering occupation government can receive it."
 iop_decide_804:0 "Determine Fate of Herzegovina"
 iop_decide_804_desc:0 "Decide which occupation government should administer Herzegovina (804). Only a bordering occupation government can receive it."
 iop_decide_105:0 "Reassign Montenegro"
 iop_decide_105_desc:0 "Decide which occupation government should administer Montenegro (105). Only a bordering occupation government can receive it."
 iop_decide_107:0 "Determine Fate of Serbia"
 iop_decide_107_desc:0 "Decide which occupation government should administer Serbia (107). Only a bordering occupation government can receive it."
 iop_decide_45:0 "Determine Fate of Vojvodina"
 iop_decide_45_desc:0 "Decide which occupation government should administer Vojvodina / Backa (45). Only Croatia or Serbia can receive it, and only if bordering the state."
 iop_decide_764:0 "Determine Fate of West Banat"
 iop_decide_764_desc:0 "Decide which occupation government should administer West Banat (764). Only Croatia or Serbia can receive it, and only if bordering the state."
 iop_decide_802:0 "Determine Fate of Kosovo"
 iop_decide_802_desc:0 "Decide which occupation government should administer Kosovo (802). Only a bordering occupation government can receive it."
 iop_decide_803:0 "Determine Fate of Southern Serbia"
 iop_decide_803_desc:0 "Decide which occupation government should administer Southern Serbia (803). Requires Serbia or Bulgaria to border the state; only a bordering occupation government can receive it."
 iop_decide_106:0 "Determine Fate of Macedonia"
 iop_decide_106_desc:0 "Decide which occupation government should administer Macedonia (106). Requires Serbia or Bulgaria to border the state; only a bordering occupation government can receive it."
 iop_decide_970:0 "Determine Fate of Debar"
 iop_decide_970_desc:0 "Decide which occupation government should administer Debar (970). Only a bordering occupation government can receive it."
 iop_decide_163_zara:0 "Determine Fate of Zara"
 iop_decide_163_zara_desc:0 "Cede Zara (163) to the Croatian occupation government, or confirm its annexation to Italy. Requires Croatia to border Zara, or the fate of Dalmatia to have been decided."
 iop_decide_852_istria:0 "Determine Fate of Istria"
 iop_decide_852_istria_desc:0 "Cede Istria (852) to the Croatian occupation government, or confirm its annexation to Italy. Requires Croatia to border Istria, or the fate of Dalmatia to have been decided."
 iop_establish_albania:0 "[ROOT.GetEstablishAlbaniaName]"
 iop_establish_albania_normal:0 "Establish Military Occupation of Albania"
 iop_establish_albania_roman:0 "Establish Province of Epirvs Nova"
 iop_establish_albania_desc:0 "[ROOT.GetEstablishAlbaniaDesc]"
 iop_establish_albania_normal_desc:0 "Requires Italy or its subjects to control Albania (Tirana). Releases IAL as an Italian puppet with cores on Albania and Shkoder. Controlled states transfer automatically."
 iop_establish_albania_roman_desc:0 "Requires Rome or its provinces to control Tirana. Reorganises the territory into the imperial province of Epirvs Nova."
 iop_establish_albania_tt:0 "Releases §YIAL§! - Governo Militare di Occupazione dell'Albania - as our puppet."
 iop_establish_albania_roman_tt:0 "Releases §YIAL§! — §YEpirvs Nova§! — as an imperial Province."
 iop_establish_bulgaria:0 "[ROOT.GetEstablishBulgariaName]"
 iop_establish_bulgaria_normal:0 "Establish Military Occupation of Bulgaria"
 iop_establish_bulgaria_roman:0 "Establish Province of Thracia"
 iop_establish_bulgaria_desc:0 "[ROOT.GetEstablishBulgariaDesc]"
 iop_establish_bulgaria_normal_desc:0 "Requires Italy or its subjects to control Sofia. Releases IBL as an Italian puppet with cores on Sofia, Moesia, Plovdiv and Burgas. Controlled states transfer automatically."
 iop_establish_bulgaria_roman_desc:0 "Requires Rome or its provinces to control Sofia. Reorganises the territory into the imperial province of Thracia."
 iop_establish_bulgaria_tt:0 "Releases §YIBL§! - Governatorato di occupazione militare della Bulgaria - as our puppet."
 iop_establish_bulgaria_roman_tt:0 "Releases §YIBL§! — §YThracia§! — as an imperial Province."
 iop_fall_of_montenegro:0 "Fall of Montenegro"
 iop_fall_of_montenegro_desc:0 "Montenegro is under Italian control. Integrate it into a neighboring occupation government, or raise a new Montenegrin occupation government."
 iop_decide_44:0 "Determine Fate of Albania"
 iop_decide_44_desc:0 "Decide which occupation government should administer Albania (44). Only a bordering occupation government can receive it."
 iop_decide_805:0 "Determine Fate of Northern Epirus"
 iop_decide_805_desc:0 "Decide which occupation government should administer Northern Epirus (805). Only Albania or Greece can receive it, and only if bordering the state."
 iop_establish_greece:0 "[ROOT.GetEstablishGreeceName]"
 iop_establish_greece_normal:0 "Establish Military Occupation of Greece"
 iop_establish_greece_roman:0 "Establish Province of Achaea"
 iop_establish_greece_desc:0 "[ROOT.GetEstablishGreeceDesc]"
 iop_establish_greece_normal_desc:0 "Requires Italy or its subjects to control Attica (Athens). Releases IGR as an Italian puppet with cores on Attica, Peloponnese, Epirus and the Aegean Islands. Controlled states transfer automatically."
 iop_establish_greece_roman_desc:0 "Requires Rome or its provinces to control Athens. Reorganises the territory into the imperial province of Achaea."
 iop_establish_greece_tt:0 "Releases §YIGR§! - Governatorato militare di occupazione della Grecia - as our puppet."
 iop_establish_greece_roman_tt:0 "Releases §YIGR§! — §YAchaea§! — as an imperial Province."
 iop_decide_731:0 "Determine Fate of Central Macedonia"
 iop_decide_731_desc:0 "Decide which occupation government should administer Central Macedonia (731). Only Greece or Bulgaria can receive it, and only if bordering the state."
 iop_decide_184:0 "Determine Fate of Thrace"
 iop_decide_184_desc:0 "Decide which occupation government should administer Thrace (184). Only Greece or Bulgaria can receive it, and only if bordering the state."
 iop_decide_182_crete:0 "Determine Fate of Crete"
 iop_decide_182_crete_desc:0 "Cede Crete (182) to the Greek occupation government, or confirm its annexation to Italy. Requires the Greek occupation government to exist."
 iop_decide_164_dodecanese:0 "Determine Fate of Dodecanese"
 iop_decide_164_dodecanese_desc:0 "Cede Dodecanese (164) to the Greek or Turkish occupation government, or confirm its annexation to Italy. Requires the Greek or Turkish occupation government to exist."
 iop_establish_turkey:0 "[ROOT.GetEstablishTurkeyName]"
 iop_establish_turkey_normal:0 "Establish Military Occupation of Turkey"
 iop_establish_turkey_roman:0 "Establish Province of Asia Minor"
 iop_establish_turkey_desc:0 "[ROOT.GetEstablishTurkeyDesc]"
 iop_establish_turkey_normal_desc:0 "Requires Italy or its subjects to control Ankara. Releases ITR as an Italian puppet with cores on all of Anatolia - from Izmit and Izmir to Van and Hakkari. Controlled states transfer automatically. (Edirne, Bursa and Istanbul stay Italian until you assign them via their fate decisions.)"
 iop_establish_turkey_roman_desc:0 "Requires Rome or its provinces to control Ankara. Reorganises the territory into the imperial province of Asia Minor."
 iop_establish_turkey_tt:0 "Releases §YITR§! - Governo militare di occupazione della Turchia - as our puppet."
 iop_establish_turkey_roman_tt:0 "Releases §YITR§! — §YAsia Minor§! — as an imperial Province."
 iop_decide_341_edirne:0 "Determine Fate of Edirne"
 iop_decide_341_edirne_desc:0 "Cede Edirne (341) to the Bulgarian or Greek occupation government, or confirm its annexation to Italy. Requires Bulgaria or Greece to border Edirne."
 iop_decide_340_bursa:0 "Determine Fate of Bursa"
 iop_decide_340_bursa_desc:0 "Cede Bursa (340) to the Turkish or Greek occupation government, or confirm its annexation to Italy. Requires a bordering Turkish or Greek occupation government."
 iop_decide_797_istanbul:0 "Determine Fate of Istanbul"
 iop_decide_797_istanbul_desc:0 "Cede Istanbul (797) to the Turkish or Greek occupation government, restore Constantinople to Greece itself, or confirm its annexation to Italy. Requires a bordering occupation government - or simply that Greece exists."
 iop_establish_north_africa:0 "[ROOT.GetEstablishNorthAfricaName]"
 iop_establish_north_africa_normal:0 "Establish Military Occupation of North Africa"
 iop_establish_north_africa_roman:0 "Establish Province of Africa Proconsvlaris"
 iop_establish_north_africa_desc:0 "[ROOT.GetEstablishNorthAfricaDesc]"
 iop_establish_north_africa_normal_desc:0 "Requires Italy or its subjects to control Tripoli. Releases INA as an Italian puppet with cores on all of Libya - Tripoli, Tripolitania, El Agheila, Sirte, Benghasi, Derna, Cyrenaica and the Libyan Desert. Controlled states transfer automatically."
 iop_establish_north_africa_roman_desc:0 "Requires Rome or its provinces to control Tripoli. Reorganises the territory into the imperial province of Africa Proconsvlaris."
 iop_establish_north_africa_tt:0 "Releases §YINA§! - Governatorato di occupazione militare del Nord Africa - as our puppet."
 iop_establish_north_africa_roman_tt:0 "Releases §YINA§! — §YAfrica Proconsvlaris§! — as an imperial Province."
 iop_give_tunisia:0 "Transfer Tunisia to North Africa"
 iop_give_tunisia_desc:0 "Give control of Gabès (665) and Tunisia (458) to the North African occupation government (INA). Requires INA to exist; every controlled state of the group transfers."
 iop_give_algeria:0 "Transfer Algeria to North Africa"
 iop_give_algeria_desc:0 "Give control of Algiers (459), Constantine (460), Tlemcen (513) and the Algerian Desert (514) to the North African occupation government (INA). Requires INA to exist; every controlled state of the group transfers."
 iop_give_morocco:0 "Transfer Morocco to North Africa"
 iop_give_morocco_desc:0 "Give control of Casablanca (461) and Marrakech (462) to the North African occupation government (INA). Requires INA to exist; every controlled state of the group transfers."
 iop_decide_290_spanish_africa:0 "Determine Fate of Spanish Africa"
 iop_decide_290_spanish_africa_desc:0 "Cede Spanish Africa (290) to the North African (INA) or Moroccan (IMR) occupation government, or annex it into Italy proper. Requires at least one of the two occupation governments to exist."
 iop_decide_783_ifni:0 "Determine Fate of Sidi Ifni"
 iop_decide_783_ifni_desc:0 "Cede Sidi Ifni (783) to the North African (INA) or Moroccan (IMR) occupation government, or integrate it into Italy proper. Requires at least one of the two occupation governments to exist."
 iop_establish_egypt:0 "[ROOT.GetEstablishEgyptName]"
 iop_establish_egypt_normal:0 "Establish Military Occupation of Egypt"
 iop_establish_egypt_roman:0 "Establish Province of Aegyptvs"
 iop_establish_egypt_desc:0 "[ROOT.GetEstablishEgyptDesc]"
 iop_establish_egypt_normal_desc:0 "Requires Italy or its subjects to control Cairo. Releases IEG as an Italian puppet with cores on Matrouh, Alexandria, Cairo, the Western Desert, Aswan and the Eastern Desert. Controlled states transfer automatically. (Suez stays Italian until you assign it via the Fall of Suez Canal; Sinai comes in a later update.)"
 iop_establish_egypt_roman_desc:0 "Requires Rome or its provinces to control Cairo. Reorganises the territory into the imperial province of Aegyptvs."
 iop_establish_egypt_tt:0 "Releases §YIEG§! - Governo militare di occupazione dell'Egitto - as our puppet."
 iop_establish_egypt_roman_tt:0 "Releases §YIEG§! — §YAegyptvs§! — as an imperial Province."
 iop_give_sudan:0 "Transfer Sudan to Egypt"
 iop_give_sudan_desc:0 "Give control of North Darfur (767), Khartoum (551), Kassala (883), Blue Nile (886), Kurdufan (549), South Darfur (887), Upper Nile (884) and Bahr al Ghazal (885) to the Egyptian occupation government (IEG). Requires IEG to exist; every controlled state of the group transfers."
 iop_fall_of_suez:0 "Fall of Suez Canal"
 iop_fall_of_suez_desc:0 "Suez is under Italian control. Give it to the Egyptian occupation government, or integrate it into Italy proper. Requires Egypt to control a state neighboring Suez."
 iop_establish_spain:0 "[ROOT.GetEstablishSpainName]"
 iop_establish_spain_normal:0 "Establish Military Occupation of Spain"
 iop_establish_spain_roman:0 "Establish Province of Hispania"
 iop_establish_spain_desc:0 "[ROOT.GetEstablishSpainDesc]"
 iop_establish_spain_normal_desc:0 "Requires Italy or its subjects to control Madrid. Releases ISP as an Italian puppet with cores on Galicia, Asturias, León, País Vasco, Navarra, Western and Eastern Aragón, Cataluña, Valladolid, Burgos, Salamanca, Madrid, Guadalajara, Valencia, Extremadura, Ciudad Real, Murcia, Córdoba, Sevilla and Granada. Controlled states transfer automatically. (Gibraltar and the Balearics stay Italian until assigned by their own decisions.)"
 iop_establish_spain_roman_desc:0 "Requires Rome or its provinces to control Madrid. Reorganises the territory into the imperial province of Hispania."
 iop_establish_spain_tt:0 "Releases §YISP§! - Governatorato militare di occupazione della Spagna - as our puppet."
 iop_establish_spain_roman_tt:0 "Releases §YISP§! — §YHispania§! — as an imperial Province."
 iop_fall_of_gibraltar:0 "Fall of Gibraltar"
 iop_fall_of_gibraltar_desc:0 "Gibraltar is under Italian control. Give it to the Spanish occupation government, or integrate it into Italy proper. Requires Spain to own a state neighboring Gibraltar."
 iop_decide_177_baleares:0 "Determine Fate of the Balearic Islands"
 iop_decide_177_baleares_desc:0 "Cede Islas Baleares (177) to the Spanish occupation government, or integrate them into Italy proper. Islands - requires only that the Spanish occupation government exists."
 iop_establish_portugal:0 "[ROOT.GetEstablishPortugalName]"
 iop_establish_portugal_normal:0 "Establish Military Occupation of Portugal"
 iop_establish_portugal_roman:0 "Establish Province of Lvsitania"
 iop_establish_portugal_desc:0 "[ROOT.GetEstablishPortugalDesc]"
 iop_establish_portugal_normal_desc:0 "Requires Italy or its subjects to control Lisbon. Releases IPG as an Italian puppet with cores on Porto, Guarda, Lisbon, Santarém and Beja. Controlled states transfer automatically."
 iop_establish_portugal_roman_desc:0 "Requires Rome or its provinces to control Lisbon. Reorganises the territory into the imperial province of Lvsitania."
 iop_establish_portugal_tt:0 "Releases §YIPG§! - Governo militare di occupazione del Portogallo - as our puppet."
 iop_establish_portugal_roman_tt:0 "Releases §YIPG§! — §YLvsitania§! — as an imperial Province."
 iop_decide_178_canarias:0 "Determine Fate of the Canary Islands"
 iop_decide_178_canarias_desc:0 "Cede Islas Canarias (178) to the Spanish occupation government, or integrate them into Italy proper. Islands - requires only that the Spanish occupation government exists."
 iop_decide_698_azores_madeira:0 "Determine Fate of Azores and Madeira"
 iop_decide_698_azores_madeira_desc:0 "Cede the Azores (698) and Madeira (697) to the Portuguese or Spanish occupation government, or integrate them into Italy proper. Islands - each option only requires its recipient to exist; every controlled island transfers."
 iop_unite_iberia:0 "Unite the Iberian Peninsula"
 iop_unite_iberia_desc:0 "Merge our two Iberian occupation governments. Spain annexes Portugal and becomes the Governatorato di occupazione militare della penisola Iberica. Visible once Portugal has been founded and Spain exists; both must still be our subjects."
 iop_unite_iberia_tt:0 "§YISP§! annexes §YIPG§! and becomes the §YGovernatorato di occupazione militare della penisola Iberica§!."
 iop_establish_occitania:0 "[ROOT.GetEstablishOccitaniaName]"
 iop_establish_occitania_normal:0 "Establish Military Occupation of Occitania"
 iop_establish_occitania_roman:0 "Establish Province of Gallia Narbonensis"
 iop_establish_occitania_desc:0 "[ROOT.GetEstablishOccitaniaDesc]"
 iop_establish_occitania_normal_desc:0 "Requires Italy or its subjects to control Aquitaine (Bordeaux). Releases IOC as an Italian puppet with cores on Centre-Sud, Limousin, Aquitaine, Pyrénées-Atlantiques, Midi-Pyrénées, Auvergne, Rhône and Languedoc. Controlled states transfer automatically."
 iop_establish_occitania_roman_desc:0 "Requires Rome or its provinces to control Bordeaux. Reorganises the territory into the imperial province of Gallia Narbonensis."
 iop_establish_occitania_tt:0 "Releases §YIOC§! - Governo militare di occupazione dell'Occitania - as our puppet."
 iop_establish_occitania_roman_tt:0 "Releases §YIOC§! — §YGallia Narbonensis§! — as an imperial Province."
 iop_decide_32_provence:0 "Determine Fate of Provence"
 iop_decide_32_provence_desc:0 "Cede Alpes (32) and Bouches-du-Rhône (21) to the Occitan occupation government, or integrate them into Italy proper. Requires Occitania to own a state bordering the group; every controlled state transfers."
 iop_decide_735_savoy_var:0 "Determine Fate of Savoy and Var"
 iop_decide_735_savoy_var_desc:0 "Cede Savoy (735) and Var (851) to the Occitan occupation government, or integrate them into Italy proper. Requires Occitania to own a state bordering the group; every controlled state transfers."
 iop_decide_1_corsica:0 "Determine Fate of Corsica"
 iop_give_poitou:0 "Transfer Poitou to Occitania"
 iop_give_poitou_desc:0 "Give Poitou (23) to the Occitan occupation government (IOC) with a core. No event. Requires IOC to exist and Poitou to be owned or controlled by Italy or one of our subjects."
 iop_establish_levant:0 "[ROOT.GetEstablishLevantName]"
 iop_establish_levant_normal:0 "Establish Military Occupation of the Levant"
 iop_establish_levant_roman:0 "Establish Province of Syria Palaestina"
 iop_establish_levant_desc:0 "[ROOT.GetEstablishLevantDesc]"
 iop_establish_levant_normal_desc:0 "Requires Italy or its subjects to control Palestine. Releases ILV as an Italian puppet with cores on Palestine, Jordan, Lebanon, Damascus, Aleppo and Deir-az-Zur. Controlled states transfer automatically."
 iop_establish_levant_roman_desc:0 "Requires Rome or its provinces to control Palestine. Reorganises the territory into the imperial province of Syria Palaestina."
 iop_establish_levant_tt:0 "Releases §YILV§! - Governatorato di occupazione militare del Levante - as our puppet."
 iop_establish_levant_roman_tt:0 "Releases §YILV§! — §YSyria Palaestina§! — as an imperial Province."
 iop_decide_799_hatay:0 "Determine Fate of Hatay"
 iop_decide_799_hatay_desc:0 "Cede Hatay (799) to the Turkish or the Levantine occupation government. Only a government owning a state bordering Hatay can receive it."
 iop_decide_453_sinai:0 "Determine Fate of Sinai"
 iop_decide_453_sinai_desc:0 "Cede Sinai (453) to the Levantine or the Egyptian occupation government (each must own a bordering state), or integrate it into Italy proper."
 iop_decide_183_cyprus:0 "Determine Fate of Cyprus"
 iop_decide_183_cyprus_desc:0 "Cede Cyprus (183) to the Turkish, Levantine or Greek occupation government, or integrate it into Italy proper. Island - each option only requires its recipient to exist."
 iop_establish_iraq:0 "[ROOT.GetEstablishIraqName]"
 iop_establish_iraq_normal:0 "Establish Military Occupation of Iraq"
 iop_establish_iraq_roman:0 "Establish Province of Mesopotamia"
 iop_establish_iraq_desc:0 "[ROOT.GetEstablishIraqDesc]"
 iop_establish_iraq_normal_desc:0 "Requires Italy or its subjects to control Baghdad. Releases IIQ as an Italian puppet with cores on Mosul, Al Anbar, Baghdad, Al Hajara and Al Basrah. Controlled states transfer automatically."
 iop_establish_iraq_roman_desc:0 "Requires Rome or its provinces to control Baghdad. Reorganises the territory into the imperial province of Mesopotamia."
 iop_establish_iraq_tt:0 "Releases §YIIQ§! - Governatorato di occupazione militare dell'Irak - as our puppet."
 iop_establish_iraq_roman_tt:0 "Releases §YIIQ§! — §YMesopotamia§! — as an imperial Province."
 iop_establish_arabia:0 "[ROOT.GetEstablishArabiaName]"
 iop_establish_arabia_normal:0 "Establish Military Occupation of Arabia"
 iop_establish_arabia_roman:0 "Establish Province of Arabia Felix"
 iop_establish_arabia_desc:0 "[ROOT.GetEstablishArabiaDesc]"
 iop_establish_arabia_normal_desc:0 "Requires Italy or its subjects to control Nejd (Riyadh). Releases IAR as an Italian puppet with cores on Jawf, Tabuk, Al-Qassim, Madinah, Dammam, Nejd, Asir-Makkah, Rub al Khali and Najiran. Controlled states transfer automatically."
 iop_establish_arabia_roman_desc:0 "Requires Rome or its provinces to control Riyadh. Reorganises the territory into the imperial province of Arabia Felix."
 iop_establish_arabia_tt:0 "Releases §YIAR§! - Governatorato di occupazione militare dell'Arabia - as our puppet."
 iop_establish_arabia_roman_tt:0 "Releases §YIAR§! — §YArabia Felix§! — as an imperial Province."
 iop_decide_656_kuwait:0 "Determine Fate of Kuwait"
 iop_decide_656_kuwait_desc:0 "Cede Kuwait (656) to the Iraqi or the Arabian occupation government (each must own a bordering state), or integrate it into Italy proper."
 iop_give_yemen:0 "Transfer Yemen to Arabia"
 iop_give_yemen_desc:0 "Give control of North Yemen (293), South Yemen (659) and the Province of Aden (992) to the Arabian occupation government (IAR). Requires IAR to exist; every controlled state of the group transfers."
 iop_decide_oman:0 "Determine Fate of Oman"
 iop_decide_oman_desc:0 "Dhofar (1016), Oman (1015) and Muscat (294) are under Italian control. Hand the coast to the Arabian occupation government (IAR), restore the Sultanate of Oman under Sultan Said bin Taimur as a separate Military Occupation of Italy, or - if the Sultanate already exists - cede further territory to it."
 iop_establish_oman_tt:0 "Restores §YIOM§! - Sultanato dell'Oman - under Sultan Said bin Taimur as a Military Occupation of Italy."
 iop_give_abu_dhabi:0 "Transfer Abu Dhabi to Arabia"
 iop_give_abu_dhabi_desc:0 "Give control of Abu Dhabi (658) to the Arabian occupation government (IAR). Requires IAR to exist."
 iop_give_qatar:0 "Transfer Qatar to Arabia"
 iop_give_qatar_desc:0 "Give control of Qatar (765) to the Arabian occupation government (IAR). Requires IAR to exist."
 iop_establish_armenia:0 "[ROOT.GetEstablishArmeniaName]"
 iop_establish_armenia_normal:0 "Establish Military Occupation of Armenia"
 iop_establish_armenia_roman:0 "Establish Province of Armenia Maior"
 iop_establish_armenia_desc:0 "[ROOT.GetEstablishArmeniaDesc]"
 iop_establish_armenia_normal_desc:0 "Requires Italy or its subjects to control Armenia (Yerevan). Releases IAM as an Italian puppet with a core on Armenia. (Trabzon and Van are assigned by their own fate decision.)"
 iop_establish_armenia_roman_desc:0 "Requires Rome or its provinces to control Yerevan. Reorganises the territory into the imperial province of Armenia Maior."
 iop_establish_armenia_tt:0 "Releases §YIAM§! - Governatorato di occupazione militare dell'Armenia - as our puppet."
 iop_establish_armenia_roman_tt:0 "Releases §YIAM§! — §YArmenia Maior§! — as an imperial Province."
 iop_establish_iran:0 "[ROOT.GetEstablishIranName]"
 iop_establish_iran_normal:0 "Establish Military Occupation of Iran"
 iop_establish_iran_roman:0 "Establish Province of Parthia"
 iop_establish_iran_desc:0 "[ROOT.GetEstablishIranDesc]"
 iop_establish_iran_normal_desc:0 "Requires Italy or its subjects to control Tehran. Releases IIR as an Italian puppet with cores on West and East Azerbaijan, Gilan, Kurdistan, Ilam, Hamadan, Khuzestan, Tehran, North Khorasan, Khorasan, Semnan, Isfahan, Yazd, South Khorasan, Fars, Kerman and Sistan. Controlled states transfer automatically."
 iop_establish_iran_roman_desc:0 "Requires Rome or its provinces to control Tehran. Reorganises the territory into the imperial province of Parthia."
 iop_establish_iran_tt:0 "Releases §YIIR§! - Governatorato di occupazione militare dell'Iran - as our puppet."
 iop_establish_iran_roman_tt:0 "Releases §YIIR§! — §YParthia§! — as an imperial Province."
 iop_decide_354_trabzon_van:0 "Determine Fate of Trabzon and Van"
 iop_decide_354_trabzon_van_desc:0 "Cede Trabzon (354) and Van (800) to the Turkish or the Armenian occupation government. Only a government owning a state bordering the group can receive them; every controlled state transfers."
 iop_decide_77_dobrudja:0 "Determine Fate of Dobrudja"
 iop_decide_77_dobrudja_desc:0 "Cede Dobrudja (77) to the Bulgarian occupation government, or integrate it into Italy proper. Requires Bulgaria to own a state bordering Dobrudja."
 iop_decide_1_corsica_desc:0 "Cede Corsica (1) to the Occitan occupation government, or integrate it into Italy proper. Island - requires only that the Occitan occupation government exists."

 iop_establish_morocco:0 "[ROOT.GetEstablishMoroccoName]"
 iop_establish_morocco_normal:0 "Establish Military Occupation of Morocco"
 iop_establish_morocco_roman:0 "Establish Province of Mavretania Tingitana"
 iop_establish_morocco_desc:0 "[ROOT.GetEstablishMoroccoDesc]"
 iop_establish_morocco_normal_desc:0 "Requires Italy or its subjects to control Casablanca (461). Releases IMR as an Italian puppet with cores on Casablanca (461) and Marrakech (462), under Governor Shakib Arslan. Controlled states transfer automatically."
 iop_establish_morocco_roman_desc:0 "Requires Rome or its provinces to control Casablanca. Reorganises the territory into the imperial province of Mavretania Tingitana."
 iop_establish_morocco_tt:0 "Releases §YIMR§! - Governo Militare di Occupazione del Marocco - as our puppet."
 iop_establish_morocco_roman_tt:0 "Releases §YIMR§! — §YMavretania Tingitana§! — as an imperial Province."
 iop_decide_699_rio_de_oro:0 "Determine Fate of Rio de Oro"
 iop_decide_699_rio_de_oro_desc:0 "Cede Rio de Oro (699) to the North African (INA) or Moroccan (IMR) occupation government, or annex it into Italy proper. Requires at least one of the two occupation governments to exist."
 iop_decide_971_north_dobrudja:0 "Determine Fate of Northern Dobruja"
 iop_decide_971_north_dobrudja_desc:0 "Cede Northern Dobruja (971) to the Bulgarian occupation government, or annex it into Italy proper. Requires Bulgaria to own a state bordering Northern Dobruja."

 iop_give_aquitaine:0 "Transfer Aquitaine and the Pyrénées-Atlantiques to Occitania"
 iop_give_aquitaine_desc:0 "Give control of Aquitaine (19) and Pyrénées-Atlantiques (806) to the Occitan occupation government (IOC). Requires IOC to exist; every controlled state of the group transfers."

 iop_decide_347_izmit:0 "Determine Fate of Izmit"
 iop_decide_347_izmit_desc:0 "Cede Izmit (347) to the Turkish or Greek occupation government, or integrate it into Italy proper. Requires a neighboring occupation government."
 iop_decide_339_izmir:0 "Determine Fate of Izmir"
 iop_decide_339_izmir_desc:0 "Cede Izmir (339) to the Turkish or Greek occupation government, or integrate it into Italy proper. Requires a neighboring occupation government."
 iop_decide_342_antalya:0 "Determine Fate of Antalya"
 iop_decide_342_antalya_desc:0 "Cede Antalya (342) to the Turkish or Greek occupation government, or integrate it into Italy proper. Requires a neighboring occupation government."

 iop_decide_658_abu_dhabi:0 "Determine Fate of Abu Dhabi"
 iop_decide_658_abu_dhabi_desc:0 "Cede Abu Dhabi (658) to the Arabian occupation government or to the Sultanate of Oman, or integrate it into Italy proper."
