l_english:
 iop_occupation_directorate:0 "Occupation Directorate"
 iop_occupation_directorate_desc:0 "Rome now runs the occupation from a single directorate. Garrisons shrink and compliance climbs, but the bureaucracy bleeds political power."
 iop_flavour_balkans:0 "Dinaric Garrison Regime"
 iop_flavour_balkans_desc:0 "Hard mountain country, harder partisans. The garrison lives off the land and fights like it."
 iop_flavour_aegean:0 "Aegean Maritime Mandate"
 iop_flavour_aegean_desc:0 "Islands and ancient coasts under Italian administration; supply runs by sea."
 iop_flavour_anatolia:0 "Anatolian Frontier Command"
 iop_flavour_anatolia_desc:0 "Vast distances and oil fields; a frontier army stretched across the plateau."
 iop_flavour_north_africa:0 "Saharan Logistics Authority"
 iop_flavour_north_africa_desc:0 "A desert occupation measured in water and fuel, not kilometres."
 iop_flavour_iberia:0 "Iberian Industrial Compact"
 iop_flavour_iberia_desc:0 "Atlantic ports and mines folded into the Italian war economy."
 iop_flavour_levant:0 "Levantine Concession State"
 iop_flavour_levant_desc:0 "Oil concessions and mandate-era politics; a wealthy, restless administration."
 iop_spirit_reprisals:0 "Harsh Reprisals"
 iop_spirit_reprisals_desc:0 "Exemplary force cowed the population - for now. Fear is not loyalty."
 iop_spirit_conciliation:0 "Policy of Conciliation"
 iop_spirit_conciliation_desc:0 "Bread and amnesty bought quiet, at the price of prestige."
 iop_spirit_requisition:0 "Forced Requisition"
 iop_spirit_requisition_desc:0 "The garrison takes what it needs; the line holds but the people starve."
 iop_spirit_provision:0 "Bread and Provisions"
 iop_spirit_provision_desc:0 "Feeding the occupied costs the treasury but keeps the peace."
 iop_spirit_directorate_efficiency:0 "Directorate Efficiency"
 iop_spirit_directorate_efficiency_desc:0 "Streamlined occupation command; fewer garrisons, faster compliance."
 iop_spirit_directorate_overreach:0 "Directorate Overreach"
 iop_spirit_directorate_overreach_desc:0 "Rome squeezed the occupation for political gain, straining the garrisons."
 iop_trait_diplomat_governor:0 "Diplomat Governor"
 iop_trait_diplomat_governor_desc:0 "A career envoy who prefers negotiation to the firing squad."
 iop_trait_carabinieri_officer:0 "Carabinieri Officer"
 iop_trait_carabinieri_officer_desc:0 "Order is kept by the gendarmerie, not the army."
 iop_trait_iron_hand:0 "Iron Hand"
 iop_trait_iron_hand_desc:0 "Counter-insurgency by decree and reprisal."
 iop_trait_viceroy:0 "Viceroy of the Crown"
 iop_trait_viceroy_desc:0 "A courtly lieutenant ruling in the King's name."
 iop_trait_airman_governor:0 "Airman Governor"
 iop_trait_airman_governor_desc:0 "A general of the air who thinks first in supply lines."
 iop_trait_civil_administrator:0 "Civil Administrator"
 iop_trait_civil_administrator_desc:0 "Of the Aegean school of colonial bureaucracy."
 iop_trait_colonial_repressor:0 "Colonial Repressor"
 iop_trait_colonial_repressor_desc:0 "Veteran of brutal pacification campaigns."
 iop_trait_logistics_organiser:0 "Logistics Organiser"
 iop_trait_logistics_organiser_desc:0 "Methodical to a fault; the depots are always full."
 iop_trait_cautious_commander:0 "Cautious Commander"
 iop_trait_cautious_commander_desc:0 "Never advances without his supply columns."
 iop_trait_hardliner:0 "Hardliner"
 iop_trait_hardliner_desc:0 "Political soldier; brooks no dissent."
 iop_trait_bureaucrat:0 "Admiralty Bureaucrat"
 iop_trait_bureaucrat_desc:0 "Runs the occupation like a naval ledger."
 iop_trait_staff_officer:0 "Staff Officer"
 iop_trait_staff_officer_desc:0 "Efficient extraction through careful paperwork."
 iop_trait_mandate_administrator:0 "Mandate Administrator"
 iop_trait_mandate_administrator_desc:0 "Learned rule through mandate-era politics."
 iop_trait_oil_director:0 "Oil Director"
 iop_trait_oil_director_desc:0 "The wells come first; everything else follows."
 iop_trait_desert_quartermaster:0 "Desert Quartermaster"
 iop_trait_desert_quartermaster_desc:0 "Master of water, camels and fuel."
 iop_trait_mountain_defender:0 "Mountain Defender"
 iop_trait_mountain_defender_desc:0 "At home above the snowline."
 iop_trait_police_chief:0 "Police Chief"
 iop_trait_police_chief_desc:0 "Rules through a quiet surveillance state."
 iop_flavour_1_title:0 "Partisan Ambush in the Dinaric Alps"
 iop_flavour_1_desc:0 "A Carabinieri patrol has been wiped out in a mountain pass. The local governor asks how Rome wishes to answer."
 iop_flavour_1_a:0 "Burn the villages - exemplary force."
 iop_flavour_1_b:0 "Offer amnesty to those who surrender."
 iop_flavour_2_title:0 "Requisition Crisis in the Aegean"
 iop_flavour_2_desc:0 "The garrison's grain requisitions have emptied the island markets and the towns are hungry."
 iop_flavour_2_a:0 "Take what the army needs."
 iop_flavour_2_b:0 "Open the army stores to the towns."
 iop_flavour_3_title:0 "Anatolian Oil Concession"
 iop_flavour_3_desc:0 "Italian firms beg for exclusive rights to the Anatolian fields, while the local administration warns of unrest."
 iop_flavour_3_a:0 "Grant the concession to Rome's firms."
 iop_flavour_3_b:0 "Keep the wells under the governorate."
 iop_flavour_4_title:0 "Supply Column Lost in the Desert"
 iop_flavour_4_desc:0 "A water and fuel column has vanished between oases. The garrison must choose how to provision itself."
 iop_flavour_4_a:0 "Requisition from the local towns."
 iop_flavour_4_b:0 "Pay for supplies from the treasury."
 iop_flavour_5_title:0 "Iberian Industry Drive"
 iop_flavour_5_desc:0 "The directorate proposes a push to integrate Iberian mines and shipyards into the war economy."
 iop_flavour_5_a:0 "Streamline the occupation command."
 iop_flavour_5_b:0 "Milk the territory for political gain."
 iop_flavour_6_title:0 "The Levantine Bazaar"
 iop_flavour_6_desc:0 "Merchants of the coastal bazaars protest new taxes; the notables offer cooperation for concessions."
 iop_flavour_6_a:0 "Meet the notables halfway."
 iop_flavour_6_b:0 "Crush the protest and collect."
 iop_flavour_7_title:0 "Monument to the King Unveiled"
 iop_flavour_7_desc:0 "A marble monument to the King has been unveiled in the occupied capital, to mixed receptions."
 iop_flavour_7_a:0 "A symbol of order and civilisation."
 iop_flavour_7_b:0 "A symbol of Italian arms."
 iop_flavour_8_title:0 "The Governors Quarrel"
 iop_flavour_8_desc:0 "Two occupation governors have fallen out over jurisdiction and are demanding Rome intervene."
 iop_flavour_8_a:0 "Settle it with a decree - for a price."
 iop_flavour_8_b:0 "Let them cool off and restore calm."
 iop_flavour_9_title:0 "Unrest in the Armenian Highlands"
 iop_flavour_9_desc:0 "Mountain villages refuse the new labour levy. The governor requests guidance."
 iop_flavour_9_a:0 "Waive the levy this season."
 iop_flavour_9_b:0 "Enforce the levy with troops."
 iop_flavour_10_title:0 "The Persian Surveillance State"
 iop_flavour_10_desc:0 "The governor's political police report quiet streets - bought with informers and fear."
 iop_flavour_10_a:0 "Ease the police measures."
 iop_flavour_10_b:0 "Expand the informant network."

 iop_trait_sultan:0 "Sultan of Muscat and Oman"
 iop_trait_sultan_desc:0 "Austere and remote, the Sultan rules through the diwan and keeps his own counsel."
 iop_trait_amir_al_bayan:0 "Amir al-Bayan"
 iop_trait_amir_al_bayan_desc:0 "The Prince of Eloquence: pan-Arab orator, agitator-organizer, and partner of Rome."
