l_english:
 iop_foc_consolidate:0 "Consolidate the Occupation"
 iop_foc_consolidate_desc:0 "Before anything else, the governor must secure the administrative centre and make the flag of Italy mean something on the street."
 iop_foc_local_police:0 "Raise Local Police"
 iop_foc_local_police_desc:0 "Auxiliary police drawn from the population keep the order that the garrison is too thin to enforce."
 iop_foc_census:0 "Register the Population"
 iop_foc_census_desc:0 "A proper census is the first step to taxing, conscripting and controlling a province."
 iop_foc_carabinieri:0 "Carabinieri Reforms"
 iop_foc_carabinieri_desc:0 "Italian officers retrain the local gendarmerie in the Carabinieri method."
 iop_foc_railways:0 "Repair the Railways"
 iop_foc_railways_desc:0 "Trains move grain, troops and taxes. The lines must run."
 iop_foc_garrison_drills:0 "Garrison Drills"
 iop_foc_garrison_drills_desc:0 "Regular drills turn a watchman's rabble into a garrison that can hold a line."
 iop_foc_levies:0 "Labour Levies"
 iop_foc_levies_desc:0 "The province owes Rome its labour. The levies provide it - willingly or not."
 iop_foc_extraction:0 "Resource Extraction"
 iop_foc_extraction_desc:0 "Survey and open the province's resources for the Italian war machine."
 iop_foc_model_province:0 "The Model Province"
 iop_foc_model_province_desc:0 "A showcase of order and industry, held up as proof of the benefits of Roman rule."
 iop_foc_tribute:0 "Tribute to Rome"
 iop_foc_tribute_desc:0 "The province pays its tribute in goods and gold, as it did two thousand years ago."
